<title>العامر لاستيراد الإكسسوارات الحريمي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* تخطيط: شريط علوي ثابت + محتوى بطاقات رأسي + شريط سفلي للأقسام السريعة + شاشات منبثقة سفلية للنماذج */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --surface2:#e7edec; --ink:#14262a; --muted:#5a6d70; --line:#d3dddc;
  --accent:#0e6b66; --accent-ink:#ffffff; --plum:#8a3b62; --pos:#1b7a4a; --neg:#b3372f; --warn:#9a6a00; --warn-bg:#fbf1d6;
  --pos-bg:#e1f3e8; --neg-bg:#f8e3e1; --shadow:0 1px 2px rgba(20,38,42,.08),0 4px 14px rgba(20,38,42,.06);
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --surface:#172326; --surface2:#1f3033; --ink:#e6eeee; --muted:#93a8ab; --line:#2b4144;
  --accent:#3fb8b0; --accent-ink:#06201f; --plum:#d089ad; --pos:#5cc98f; --neg:#ff8a80; --warn:#f0c14b; --warn-bg:#35290a;
  --pos-bg:#12301f; --neg-bg:#3a1a18; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --surface:#172326; --surface2:#1f3033; --ink:#e6eeee; --muted:#93a8ab; --line:#2b4144;
  --accent:#3fb8b0; --accent-ink:#06201f; --plum:#d089ad; --pos:#5cc98f; --neg:#ff8a80; --warn:#f0c14b; --warn-bg:#35290a;
  --pos-bg:#12301f; --neg-bg:#3a1a18; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 84px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--accent);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
.num,.m{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-ink);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px}
.top h1{font:700 18px/1.2 var(--f-display);margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .st{font-size:11px;opacity:.9;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:99px;white-space:nowrap}
.ib{background:rgba(255,255,255,.16);border:0;color:inherit;width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;display:grid;place-items:center}
main{padding-block:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2{font:700 15px/1.3 var(--f-display);margin:0 0 10px;color:var(--accent);letter-spacing:.2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font:600 17px/1.35 var(--f-body);word-break:break-word}
.stat.big{grid-column:1/-1}
.pos{color:var(--pos)} .neg{color:var(--neg)} .zero{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-align:center}
.btn.alt{background:var(--surface2);color:var(--ink)} .btn.plum{background:var(--plum);color:#fff} .btn.danger{background:var(--neg-bg);color:var(--neg)} .btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:focus-visible,.ib:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.acts .btn{width:100%}
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0} .row .t{font-weight:600;overflow-wrap:anywhere} .row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .e{text-align:left;white-space:nowrap;font-weight:600}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-inline-start:6px;white-space:nowrap}
.pill.pos{background:var(--pos-bg);color:var(--pos)} .pill.neg{background:var(--neg-bg);color:var(--neg)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.info{background:var(--surface2);color:var(--muted);border-radius:12px;padding:10px 12px;font-size:13.5px}
.bal{border-radius:12px;padding:12px;text-align:center;font-weight:700}
.bal.pos{background:var(--pos-bg);color:var(--pos)} .bal.neg{background:var(--neg-bg);color:var(--neg)} .bal.zero{background:var(--surface2);color:var(--muted)}
.bal .n{font:700 24px/1.3 var(--f-display)}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);min-width:0}
.fields{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;white-space:nowrap;cursor:pointer;min-height:40px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-weight:600;position:sticky;top:0}
td.n,th.n{text-align:left}
tfoot td{font-weight:700;background:var(--surface2)}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.nav button{background:none;border:0;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:52px}
.nav button .i{font-size:20px;line-height:1} .nav button.on{color:var(--accent);font-weight:700;background:var(--surface2)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.menu button{background:var(--surface);border:0;border-radius:14px;padding:16px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:600;cursor:pointer;min-height:90px}
.menu .i{font-size:26px}
.pdfv{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}.pdfh{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}.pdfh b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pdfb{flex:1;overflow:auto;padding:10px;background:#6b7778;-webkit-overflow-scrolling:touch}.pdfb img{display:block;width:100%;margin:0 auto 10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}.pdff{display:flex;gap:8px;padding:10px;background:var(--surface);border-top:1px solid var(--line)}.pdff .btn{flex:1;min-height:48px;padding:8px}
.scrim{position:fixed;inset:0;background:rgba(5,15,16,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;min-width:0;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h3{font:700 17px var(--f-display);margin:0;flex:1}
.sheet .body{overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet footer{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet footer .btn{flex:1}
.ln{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ln .tt{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.toast{position:fixed;inset:auto 16px calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;text-align:center;box-shadow:var(--shadow)}
.toast.err{background:var(--neg);color:#fff}
.sep{height:1px;background:var(--line);margin:4px 0}
.hint{font-size:12.5px;color:var(--muted)}
.row2{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)} .row2:last-child{border-bottom:0}
.row2 span:first-child{color:var(--muted)} .row2 b{font-weight:600}
#splash{position:fixed;inset:0;z-index:100;background:#070706;display:grid;place-items:center;transition:opacity .45s ease}
#splash img{width:min(80vw,440px);aspect-ratio:1;object-fit:contain;display:block;-webkit-mask-image:radial-gradient(circle closest-side,#000 90%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 90%,transparent 100%)}
#splash.out{opacity:0;pointer-events:none}
.top .lg{width:38px;height:38px;border-radius:50%;flex:none;background:#070706;object-fit:cover}
.brand{display:flex;justify-content:center;padding-block:6px}
.brand img{width:min(58vw,220px);aspect-ratio:1;border-radius:50%;object-fit:cover;background:#070706;box-shadow:var(--shadow)}
tr[data-act]:active td{background:var(--surface2)}
html,body{overscroll-behavior-y:contain}
.hero{background:linear-gradient(160deg,var(--accent),#0a4f4b);color:var(--accent-ink);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.hero small{display:block;opacity:.85;font-size:14px}
.hero .big{font:700 30px/1.25 var(--f-display);margin:2px 0 6px;word-break:break-word}
.hero .big.neg{color:#ffd0d0}
.hero .eq{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;opacity:.95}
.hero .eq b{font-weight:700}
.hero .why{font-size:12.5px;opacity:.8;margin-top:8px}
.pk{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.pk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk.ph span{color:var(--muted)} .pk i{font-style:normal;color:var(--muted)}
.pov{position:fixed;left:0;right:0;top:0;height:100%;z-index:55;background:var(--bg);display:flex;flex-direction:column;max-width:640px;margin-inline:auto}
.pov header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.pov header h3{font:700 17px var(--f-display);margin:0;flex:1}
.pov .srch{padding:10px 12px 4px}
.pov .pchips{padding:4px 12px}
.pov .pl{overflow-y:auto;flex:1;padding:4px 12px 24px;display:flex;flex-direction:column;gap:6px}
.pov .po{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:start;cursor:pointer;min-height:52px}
.pov .po.on{outline:2px solid var(--accent)} .pov .po.new{background:var(--surface2);color:var(--accent);font-weight:700}
.pov .po .t{font-weight:600} .pov .po .s{font-size:12.5px;color:var(--muted)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
#ptr{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translate(-50%,-60px);z-index:25;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none}
.draft{background:var(--warn-bg,#fff4d6);color:var(--warn,#7a5a00);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.draft .btn{min-height:38px;padding:6px 12px}
.tbl.st td:nth-child(2){white-space:normal}
.tbl.st td{vertical-align:top}
.tbl.st table{font-size:12px;table-layout:fixed;width:100%}
.tbl.st th:nth-child(1),.tbl.st td:nth-child(1){width:72px}
.tbl.st th:nth-child(3),.tbl.st td:nth-child(3){width:74px}
.tbl.st th:nth-child(4),.tbl.st td:nth-child(4){width:84px}
.tbl.st td,.tbl.st th{white-space:normal;word-break:break-word}
.tbl.st.ln th:nth-child(3),.tbl.st.ln td:nth-child(3){width:112px;word-break:normal}
.tbl.st.ln td:nth-child(3) b{white-space:nowrap}
.tbl.st th,.tbl.st td{padding:8px 5px}
.tbl.st td:nth-child(1){font-size:11px}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
@media (prefers-reduced-motion:no-preference){.scrim{animation:fi .15s ease-out}.sheet{animation:up .2s ease-out}@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(30px)}}}
/* ===== v8: هوية بصرية موحدة (ذهبي من الشعار + أخضر هادئ) ===== */
:root{--gold:#b8913a;--gold2:#ecd79a;--bar:#0b1d1e;--surface3:#f8faf9}
body::before{background:var(--bar)}
.top{background:var(--bar);color:var(--gold2);border-bottom:1px solid rgba(184,145,58,.5);gap:8px}
.top h1{color:var(--gold2);font-size:17px}
.top .lg{box-shadow:0 0 0 1.5px var(--gold);width:36px;height:36px}
.top .ib{width:40px;height:40px;font-size:18px;border-radius:12px;background:rgba(236,215,154,.12);color:var(--gold2)}
.top .st{background:rgba(236,215,154,.14);color:var(--gold2);max-width:38vw;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center}
.top .st::before,.dot{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5cc98f;margin-inline-end:6px;flex:none}
body.off .top .st::before,body.off .dot{background:#ff8a80}
body.off .top .st::after{content:" · بدون إنترنت";white-space:nowrap}
.ib,.btn,.chip,.row,.pk,.menu button,.nav button,.tile{transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease}
.ib:active,.btn:active,.chip:active,.menu button:active,.nav button:active,.tile:active{transform:scale(.97)}
main{gap:16px;padding-block:16px}
.card{border-radius:18px;padding:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.card h2{font-size:15.5px;margin-bottom:12px}
.btn{border-radius:14px;min-height:50px;font-size:15.5px}
.btn.plum{background:var(--plum)}
.btn.gold{background:linear-gradient(180deg,#d9b963,#b8913a);color:#241a02}
input,select,textarea,.pk{border-radius:14px;border-width:1.5px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip{min-height:42px;font-weight:500}
.nav{border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.nav button.on{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.sheet{border-radius:24px 24px 0 0;border-top:2px solid var(--gold)}
.sheet header h3,.pov header h3{color:var(--accent)}
.hero{background:linear-gradient(155deg,#0f726c 0%,#093f3b 70%);border:1px solid rgba(236,215,154,.5);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:-40% auto auto -20%;width:70%;aspect-ratio:1;background:radial-gradient(circle,rgba(236,215,154,.22),transparent 65%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .big{font-size:36px;color:#fff}
.hero small{color:var(--gold2);opacity:1;font-weight:500}
.home-brand{display:flex;align-items:center;gap:12px}
.home-brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#070706;box-shadow:0 0 0 2px var(--gold);flex:none}
.home-brand .hb{flex:1;min-width:0;display:flex;flex-direction:column}
.home-brand .hb b{font:700 17px/1.3 var(--f-display);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-brand .hb .conn{font-size:12.5px;color:var(--muted);display:flex;align-items:center}
.home-brand .ib{background:var(--surface2);color:var(--ink);width:44px;height:44px;border:1px solid var(--line);border-radius:14px;cursor:pointer;display:grid;place-items:center;font-size:19px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;min-width:0;box-shadow:var(--shadow)}
.tile small{display:block;color:var(--muted);font-size:12.5px}
.tile b{display:block;font:700 16px/1.4 var(--f-body);margin-top:2px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa .btn{flex-direction:column;gap:2px;min-height:68px;font-size:15px}
.qa .btn .qi{font-size:22px;line-height:1}
.rec .row{padding:11px 2px}
.rec .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);font-size:18px;flex:none}
.rec .ic.in{background:var(--pos-bg)} .rec .ic.out{background:var(--neg-bg)}
.sect{display:flex;align-items:center;justify-content:space-between;margin:0 2px -4px}
.sect h2{font:700 15.5px var(--f-display);color:var(--accent);margin:0}
.sect a{font-size:13.5px;color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}
.rg .row{padding:13px 2px}
.rg .gi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--surface2);flex:none}
.gh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.gh b{font:700 16px var(--f-display);display:block} .gh span{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;direction:ltr}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.toast{background:var(--bar);color:#fff;border-inline-start:5px solid var(--pos);text-align:start;display:flex;gap:8px;align-items:center}
.toast.err{background:var(--bar);border-inline-start-color:var(--neg);color:#ffd7d3}
.toast.info{border-inline-start-color:var(--gold)}
/* شاشة البداية */
#splash{background:#070706}
#splash .sp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 24px;text-align:center}
#splash .sp-logo{position:relative;width:min(62vw,290px)}
#splash .sp-logo::before{content:"";position:absolute;inset:-14%;background:radial-gradient(circle,rgba(212,175,90,.42),transparent 62%);opacity:0;animation:spGlow 1.4s ease-out .1s both}
#splash img{position:relative;width:100%}
#splash .sp-name{font:700 30px/1.3 var(--f-display);color:var(--gold2);opacity:0;animation:spUp .55s ease-out .3s both}
#splash .sp-sub{font-size:14.5px;color:#b9a66f;opacity:0;animation:spUp .55s ease-out .45s both}
#splash .sp-bar{width:120px;height:3px;border-radius:3px;background:rgba(236,215,154,.16);overflow:hidden;margin-top:16px;opacity:0;animation:spUp .4s ease-out .5s both}
#splash .sp-bar i{display:block;height:100%;width:40%;border-radius:3px;background:#d4af5a;animation:spBar 1s ease-in-out infinite alternate}
#splash .sp{animation:spIn .6s ease-out both}
#splash.out .sp{transform:scale(1.04);transition:transform .45s ease}
@keyframes spIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spGlow{0%{opacity:0;transform:scale(.8)}60%{opacity:1}100%{opacity:.7;transform:scale(1)}}
@keyframes spBar{from{transform:translateX(-120%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#splash .sp,#splash .sp-name,#splash .sp-sub,#splash .sp-bar,#splash .sp-logo::before,#splash .sp-bar i{animation:none;opacity:1}}

.eq3{display:flex;gap:8px;margin-top:6px}
.eq3 span{flex:1;min-width:0;background:rgba(255,255,255,.1);border-radius:12px;padding:7px 8px;font-size:12px;color:var(--gold2);display:flex;flex-direction:column;align-items:center}
.eq3 b{color:#fff;font:700 14px/1.4 var(--f-body);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.home-brand .hb b{white-space:normal;font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips.wrap .chip,.pbar .chip{flex:none}
@media (max-width:360px){.top .st{font-size:0;padding:6px 8px;gap:0}.top .st::before{margin:0}.top h1{font-size:16px}.hero .big{font-size:31px}}

details.aud{border-bottom:1px solid var(--line);padding:10px 2px}
details.aud:last-child{border-bottom:0}
details.aud summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}
details.aud summary::-webkit-details-marker{display:none}
details.aud summary .ah{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
details.aud[open] summary{margin-bottom:6px}
</style>
</head>
