<script>
/* ============================================================
   العامر - المحرك المحاسبي (بدون واجهة، قابل للاختبار)
   كل المبالغ أعداد صحيحة بالقرش (1 جنيه = 100 قرش) لتجنب أخطاء التقريب.
   كل الأرصدة والمخزون والأرباح تُحسب من السجلات (لا تُخزَّن)،
   لذلك إعادة فتح أي فاتورة لا تكرر أثرها أبدًا.
   ============================================================ */
(function (root) {
  'use strict';

  const toQ = (pounds) => Math.round((Number(pounds) || 0) * 100 + (pounds < 0 ? -1e-9 : 1e-9));
  const toP = (q) => (q || 0) / 100;
  const qty3 = (n) => Math.round((Number(n) || 0) * 1000) / 1000;

  const ACCOUNTS = { trade: 'نقدية معي (خزنة الشغل)', bank: 'رصيد في البنك', wallet: 'محفظة / حساب آخر', personal: 'أموالي الشخصية' };
  const WORK_ACCS = ['trade', 'bank', 'wallet'];
  const INVOICE_TYPES = {
    sale: { label: 'فاتورة بيع', prefix: 'S' },
    purchase: { label: 'فاتورة شراء', prefix: 'P' },
    sale_return: { label: 'مرتجع مبيعات', prefix: 'SR' },
    purchase_return: { label: 'مرتجع مشتريات', prefix: 'PR' },
  };
  const EXPENSE_CATS = ['النقل', 'الشحن', 'التحميل', 'التخزين', 'العمالة', 'الطعام', 'الإيجار', 'الكهرباء', 'التعبئة والتغليف', 'مصروفات بنكية', 'أخرى'];
  const LOAN_TYPE_DEFAULTS = ['سلفة نقدية', 'سلفة بضاعة', 'سلفة شخصية', 'سلفة للشغل', 'سلفة طوارئ'];

  function emptyState() {
    const st0 = {
      v: 1,
      settings: {
        shopName: 'العامر لاستيراد الإكسسوارات الحريمي',
        startDate: '',
        dupIgnored: [],
        categories: [], // فئات الأصناف (أسماء)
        userName: '', // اسم المستخدم الذي يظهر في سجل المراجعة
        myShare: 50, // نسبة نصيبي من الأرباح %
        allowNegativeStock: false,
        openingCash: { trade: 0, personal: 0 },
      },
      counters: { S: 0, P: 0, SR: 0, PR: 0, T: 0, PTY: 0, ITM: 0, ADJ: 0, PRT: 0, CAP: 0, ARC: 0 },
      parties: [],
      partners: [],
      partnerCapital: [],
      items: [],
      invoices: [],
      txns: [],
      adjustments: [],
      audit: [],
      recycle: [], // فهرس الأرشيف: إشارات للسجلات المحذوفة (لا نسخ للبيانات)
    };
    ensurePartners(st0);
    return st0;
  }

  const today = () => new Date().toISOString().slice(0, 10);
  const pad = (n, w) => String(n).padStart(w, '0');
  function nextNo(st, key, width) { st.counters[key] = (st.counters[key] || 0) + 1; return pad(st.counters[key], width); }
  function log(st, action, ref, detail, extra) {
    const e = { at: new Date().toISOString(), action, ref, detail: detail || '', user: (st.settings && st.settings.userName) || 'المستخدم' };
    if (extra) { if (extra.old !== undefined) e.old = extra.old; if (extra.new !== undefined) e.new = extra.new; }
    st.audit.push(e);
  }
  const txnBrief = (t) => ({ partnerId: t.partnerId || undefined, type: t.type, date: t.date, amount: t.amount, acc: t.acc, toAcc: t.toAcc, partyId: t.partyId, method: t.method, note: t.note, nature: t.nature, category: t.category, loanType: t.loanType, scope: t.scope, paidBy: t.paidBy, partnerAmount: t.partnerEffectAmount, effectSign: t.partnerEffectSign });
  const itemBrief = (i) => ({ name: i.name, code: i.code, category: i.category, unit: i.unit, cost: i.cost, price: i.price, minQty: i.minQty, openingQty: i.openingQty });
  const partyBrief = (p) => ({ name: p.name, phone: p.phone, address: p.address, notes: p.notes, opening: p.opening });
  const invBrief = (i) => ({ no: i.no, type: i.type, date: i.date, partyId: i.partyId, total: i.total, paid: i.paid, payMode: i.payMode, lines: (i.lines || []).map((l) => ({ name: l.name, qty: l.qty, unit: l.unit, net: l.net })) });
  function fail(msg) { const e = new Error(msg); e.userMessage = msg; throw e; }

  /* ---------- الأطراف ---------- */
  function addParty(st, p) {
    if (!p.name || !String(p.name).trim()) fail('اسم الطرف مطلوب');
    const dup = st.parties.find((x) => !x.deleted && x.name.trim() === String(p.name).trim());
    if (dup && dup.loanOnly) { // نفس الشخص موجود في السلف فقط: نحوّله إلى عميل/مورد بدل إنشاء نسخة مكررة
      dup.loanOnly = false; if (p.phone) dup.phone = p.phone; if (p.address) dup.address = p.address; if (p.notes) dup.notes = p.notes; if (p.opening) dup.opening = toQ(p.opening);
      log(st, 'إضافة طرف', dup.id, dup.name + ' (كان في السلف فقط)', { new: partyBrief(dup) }); return dup;
    }
    if (dup) fail('يوجد طرف بنفس الاسم. استخدم الحساب الموجود بدل إنشاء حساب ثانٍ.');
    const id = 'PTY-' + nextNo(st, 'PTY', 4);
    const party = {
      id, name: String(p.name).trim(), phone: p.phone || '', address: p.address || '', notes: p.notes || '',
      kind: 'both', // كل الأطراف حساب واحد موحد: عميل ومورد معًا
      opening: toQ(p.opening || 0), // موجب = مدين لي (عليه لي)، سالب = دائن (عليّ له)
      createdAt: new Date().toISOString(),
    };
    st.parties.push(party);
    log(st, 'إضافة طرف', id, party.name, { new: partyBrief(party) });
    return party;
  }
  function updateParty(st, id, patch) {
    const p = st.parties.find((x) => x.id === id); if (!p) fail('الطرف غير موجود');
    const oldP = { name: p.name, phone: p.phone, address: p.address, notes: p.notes, opening: p.opening };
    if (patch.name != null) {
      const n = String(patch.name).trim(); if (!n) fail('اسم الطرف مطلوب');
      const dup = st.parties.find((x) => x.id !== id && !x.deleted && x.name.trim() === n);
      if (dup) fail('يوجد طرف آخر بنفس الاسم');
      p.name = n;
    }
    ['phone', 'address', 'notes'].forEach((k) => { if (patch[k] != null) p[k] = patch[k]; });
    if (patch.opening != null) p.opening = toQ(patch.opening);
    log(st, 'تعديل طرف', id, p.name, { old: oldP, new: { name: p.name, phone: p.phone, address: p.address, notes: p.notes, opening: p.opening } });
    return p;
  }

  /* ---------- حذف ودمج الأطراف ---------- */
  function normName(s) { return String(s || '').replace(/[ً-ٰٟـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function normPhone(s) { const d = String(s || '').replace(/[٠-٩]/g, (c) => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g, ''); return d.length >= 9 ? d.slice(-9) : ''; }
  function partyUsage(st, id) {
    const p = st.parties.find((x) => x.id === id); if (!p) fail('الطرف غير موجود');
    const invoices = st.invoices.filter((i) => i.partyId === id && !i.voided && !i.archived).length;
    const txns = st.txns.filter((t) => t.partyId === id && !t.voided).length;
    return { invoices, txns, opening: p.opening, used: invoices > 0 || txns > 0 || p.opening !== 0 };
  }
  // الحذف الآمن: لا يُحذف طرف له فواتير أو حركات أو رصيد، حتى لا تضيع حسابات
  function deleteParty(st, id) {
    const p = st.parties.find((x) => x.id === id); if (!p || p.deleted) fail('الطرف غير موجود');
    const u = partyUsage(st, id);
    if (u.used) fail('لا يمكن حذف «' + p.name + '» لأن له ' + u.invoices + ' فاتورة و' + u.txns + ' حركة' + (u.opening ? ' ورصيدًا افتتاحيًا' : '') + '. احذف فواتيره وحركاته أولًا، أو ادمجه مع طرف آخر إن كان مكررًا.');
    p.deleted = true; p.deletedAt = new Date().toISOString();
    log(st, 'حذف طرف', id, p.name, { old: partyBrief(p) });
    recycleAdd(st, 'party', id);
    return p;
  }
  // الدمج: ينقل كل فواتير وحركات ورصيد طرف إلى طرف آخر، والمجموع قبل الدمج = المجموع بعده تمامًا
  function mergeParties(st, keepId, dropId) {
    if (keepId === dropId) fail('اختر طرفين مختلفين');
    const keep = st.parties.find((x) => x.id === keepId && !x.deleted), drop = st.parties.find((x) => x.id === dropId && !x.deleted);
    if (!keep || !drop) fail('الطرف غير موجود');
    const before = partyBalance(st, keepId) + partyBalance(st, dropId);
    const snap = JSON.stringify({ p: st.parties, i: st.invoices, t: st.txns });
    st.invoices.forEach((i) => { if (i.partyId === dropId) i.partyId = keepId; });
    st.txns.forEach((t) => { if (t.partyId === dropId) t.partyId = keepId; });
    keep.opening += drop.opening;
    if (!keep.phone && drop.phone) keep.phone = drop.phone;
    if (!keep.address && drop.address) keep.address = drop.address;
    keep.notes = (keep.notes ? keep.notes + '\n' : '') + 'مدمج من: ' + drop.name + (drop.phone ? ' (' + drop.phone + ')' : '') + (drop.notes ? ' - ' + drop.notes : '');
    drop.opening = 0; drop.deleted = true; drop.mergedInto = keepId; drop.deletedAt = new Date().toISOString();
    if (partyBalance(st, keepId) !== before) { const s = JSON.parse(snap); st.parties = s.p; st.invoices = s.i; st.txns = s.t; fail('تعذر الدمج لأن الأرصدة لا تتطابق. لم يتغير شيء.'); }
    log(st, 'دمج طرفين', keepId, drop.name + ' ← ' + keep.name);
    return keep;
  }
  // اقتراحات فقط: لا يُدمج شيء إلا بعد تأكيدك
  function findDuplicateParties(st) {
    const live = st.parties.filter((p) => !p.deleted); const ign = new Set(st.settings.dupIgnored || []);
    const pairs = new Map();
    const add = (a, b, why) => {
      const k = [a.id, b.id].sort().join('|'); if (ign.has(k)) return;
      const e = pairs.get(k) || { a, b, why: [] }; if (!e.why.includes(why)) e.why.push(why); pairs.set(k, e);
    };
    const group = (keyFn, why) => { const m = new Map(); live.forEach((p) => { const k = keyFn(p); if (k) (m.get(k) || m.set(k, []).get(k)).push(p); }); m.forEach((arr) => { for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) add(arr[i], arr[j], why); }); };
    group((p) => normPhone(p.phone), 'نفس رقم الهاتف');
    group((p) => normName(p.name), 'نفس الاسم مع اختلاف بسيط في الكتابة');
    return [...pairs.values()].map((e) => {
      const pa = normPhone(e.a.phone), pb = normPhone(e.b.phone);
      return { a: e.a, b: e.b, why: e.why, phoneConflict: !!(pa && pb && pa !== pb), strong: e.why.length > 1 };
    });
  }
  function ignoreDuplicate(st, aId, bId) {
    const k = [aId, bId].sort().join('|'); st.settings.dupIgnored = st.settings.dupIgnored || [];
    if (!st.settings.dupIgnored.includes(k)) st.settings.dupIgnored.push(k);
    log(st, 'تجاهل اقتراح دمج', k, 'شخصان مختلفان');
  }

  /* ---------- الأصناف ---------- */
  function addItem(st, it) {
    if (!it.name || !String(it.name).trim()) fail('اسم الصنف مطلوب');
    const id = 'ITM-' + nextNo(st, 'ITM', 4);
    const item = {
      id, code: it.code || id, name: String(it.name).trim(), category: it.category || '', unit: it.unit || 'قطعة',
      cost: toQ(it.cost || 0), price: toQ(it.price || 0), openingQty: qty3(it.openingQty || 0),
      minQty: qty3(it.minQty || 0), notes: it.notes || '', createdAt: new Date().toISOString(),
    };
    if (st.items.find((x) => !x.deleted && x.code === item.code && x.id !== id)) fail('كود الصنف مستخدم من قبل');
    item.category = String(item.category || '').trim();
    st.items.push(item);
    if (item.category) ensureCategory(st, item.category);
    log(st, 'إضافة صنف', id, item.name, { new: itemBrief(item) });
    return item;
  }
  function updateItem(st, id, patch) {
    const it = st.items.find((x) => x.id === id); if (!it) fail('الصنف غير موجود');
    const oldIt = itemBrief(it);
    ['code', 'name', 'category', 'unit', 'notes'].forEach((k) => { if (patch[k] != null) it[k] = patch[k]; });
    ['cost', 'price'].forEach((k) => { if (patch[k] != null) it[k] = toQ(patch[k]); });
    ['openingQty', 'minQty'].forEach((k) => { if (patch[k] != null) it[k] = qty3(patch[k]); });
    it.category = String(it.category || '').trim();
    if (it.category) ensureCategory(st, it.category);
    log(st, 'تعديل صنف', id, it.name, { old: oldIt, new: itemBrief(it) });
    return it;
  }


  /* ---------- فئات الأصناف ---------- */
  // الفئة اختيارية. اسم الفئة يُحفظ على الصنف نفسه، والقائمة في الإعدادات تسهّل الاختيار. حذف فئة لا يحذف أي صنف.
  function categoryList(st) { return (st.settings.categories || []).slice(); }
  function sameCat(a, b) { return normName(a) === normName(b); }
  function ensureCategory(st, name) {
    name = String(name || '').trim(); if (!name) return null;
    if (!Array.isArray(st.settings.categories)) st.settings.categories = [];
    const ex = st.settings.categories.find((c) => sameCat(c, name)); if (ex) return ex;
    st.settings.categories.push(name); return name;
  }
  function addCategory(st, name) {
    name = String(name || '').trim(); if (!name) fail('اكتب اسم الفئة');
    if (!Array.isArray(st.settings.categories)) st.settings.categories = [];
    if (st.settings.categories.some((c) => sameCat(c, name))) fail('هذه الفئة موجودة بالفعل');
    st.settings.categories.push(name); log(st, 'إضافة فئة', '', name); return name;
  }
  function renameCategory(st, oldName, newName) {
    newName = String(newName || '').trim(); if (!newName) fail('اكتب اسم الفئة');
    const list = st.settings.categories || []; const i = list.findIndex((c) => c === oldName); if (i < 0) fail('الفئة غير موجودة');
    if (list.some((c, j) => j !== i && sameCat(c, newName))) fail('يوجد فئة بنفس الاسم');
    let n = 0; st.items.forEach((it) => { if (it.category === oldName || sameCat(it.category, oldName)) { it.category = newName; n++; } });
    list[i] = newName; log(st, 'تعديل فئة', '', oldName + ' ← ' + newName + ' (' + n + ' صنف)'); return n;
  }
  // يحذف الفئة فقط. الأصناف تبقى كما هي وتصبح «بدون فئة».
  function deleteCategory(st, name) {
    const list = st.settings.categories || []; const i = list.findIndex((c) => c === name); if (i < 0) fail('الفئة غير موجودة');
    let n = 0; st.items.forEach((it) => { if (it.category && sameCat(it.category, name)) { it.category = ''; n++; } });
    list.splice(i, 1); log(st, 'حذف فئة', '', name + ' (' + n + ' صنف أصبحت بدون فئة)'); return n;
  }
  function categoryCount(st, name) { return st.items.filter((it) => !it.deleted && it.category && sameCat(it.category, name)).length; }
  // ترحيل: أي تصنيف مكتوب سابقًا على الأصناف يدخل قائمة الفئات (دون تغيير الأصناف)
  function syncCategories(st) {
    if (!Array.isArray(st.settings.categories)) { st.settings.categories = []; }
    let changed = false;
    st.items.forEach((it) => { if (it.category && String(it.category).trim()) { const before = st.settings.categories.length; const c = ensureCategory(st, it.category); if (c && c !== it.category && sameCat(c, it.category)) { it.category = c; changed = true; } if (st.settings.categories.length !== before) changed = true; } });
    return changed;
  }

  /* ---------- محرك المخزون (متوسط مرجح، إعادة تشغيل بالترتيب الزمني) ---------- */
  function stockEvents(st) {
    const ev = [];
    st.items.forEach((it) => {
      if (it.openingQty) ev.push({ k: 'open', itemId: it.id, qty: it.openingQty, unitCost: it.cost, date: '0000-00-00', seq: 0 });
    });
    st.invoices.forEach((inv) => {
      if (inv.voided) return;
      inv.lines.forEach((ln, i) => {
        ev.push({ k: inv.type, itemId: ln.itemId, qty: ln.qty, unit: ln.unit, date: inv.date, seq: inv.seq, inv, line: i, lineNet: ln.net });
      });
    });
    st.adjustments.forEach((a) => {
      if (a.voided) return;
      ev.push({ k: 'adjust', itemId: a.itemId, qty: a.delta, date: a.date, seq: a.seq, adj: a });
    });
    ev.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq));
    return ev;
  }

  function computeInventory(st) {
    const per = {};
    st.items.forEach((it) => { per[it.id] = { qty: 0, value: 0, avg: it.cost, purchased: 0, sold: 0, soldReturned: 0, purchaseReturned: 0, adjusted: 0 }; });
    const cogs = {}; // invoiceId -> cost of goods (for sale / sale_return)
    const retDiff = {}; // purchase return gain/loss by invoice
    const adjValue = {}; // adjustment id -> value delta
    const negatives = [];
    stockEvents(st).forEach((e) => {
      const s = per[e.itemId]; if (!s) return;
      if (e.k === 'open') { s.qty += e.qty; s.value += Math.round(e.qty * e.unitCost); s.avg = s.qty ? s.value / s.qty : s.avg; }
      else if (e.k === 'purchase') {
        s.qty += e.qty; s.value += e.lineNet; s.purchased += e.qty; s.avg = s.qty > 0 ? s.value / s.qty : s.avg;
      } else if (e.k === 'sale') {
        const c = Math.round(e.qty * s.avg); s.qty -= e.qty; s.value -= c; s.sold += e.qty;
        cogs[e.inv.id] = (cogs[e.inv.id] || 0) + c;
        if (s.qty < -1e-9) negatives.push({ itemId: e.itemId, invoice: e.inv.no, date: e.date });
        if (s.qty <= 1e-9) { s.value = Math.round(s.qty * s.avg); }
      } else if (e.k === 'sale_return') {
        const c = Math.round(e.qty * s.avg); s.qty += e.qty; s.value += c; s.soldReturned += e.qty;
        cogs[e.inv.id] = (cogs[e.inv.id] || 0) + c;
      } else if (e.k === 'purchase_return') {
        const c = Math.round(e.qty * s.avg); s.qty -= e.qty; s.value -= c; s.purchaseReturned += e.qty;
        retDiff[e.inv.id] = (retDiff[e.inv.id] || 0) + (e.lineNet - c);
        if (s.qty < -1e-9) negatives.push({ itemId: e.itemId, invoice: e.inv.no, date: e.date });
      } else if (e.k === 'adjust') {
        const c = Math.round(e.qty * s.avg); s.qty += e.qty; s.value += c; s.adjusted += e.qty;
        adjValue[e.adj.id] = c;
      }
    });
    let totalValue = 0;
    Object.values(per).forEach((s) => { s.qty = qty3(s.qty); s.value = Math.round(s.value); totalValue += Math.max(0, s.value); });
    return { per, cogs, retDiff, adjValue, totalValue, negatives };
  }

  // حركة دخول وخروج صنف (قراءة فقط من نفس أحداث المخزون، فالرصيد الأخير = الكمية الحالية)
  function itemMovements(st, itemId) {
    const rows = []; let bal = 0;
    stockEvents(st).filter((e) => e.itemId === itemId).forEach((e) => {
      let inn = 0, out = 0, label = '', ref = '', partyId = '';
      if (e.k === 'open') { inn = e.qty; label = 'رصيد أول المدة'; }
      else if (e.k === 'purchase') { inn = e.qty; label = 'شراء'; }
      else if (e.k === 'sale') { out = e.qty; label = 'بيع'; }
      else if (e.k === 'sale_return') { inn = e.qty; label = 'مرتجع مبيعات'; }
      else if (e.k === 'purchase_return') { out = e.qty; label = 'مرتجع مشتريات'; }
      else if (e.k === 'adjust') { if (e.qty >= 0) inn = e.qty; else out = -e.qty; label = 'تسوية جرد' + (e.adj && e.adj.reason ? ': ' + e.adj.reason : ''); }
      if (e.inv) { ref = e.inv.no; partyId = e.inv.partyId; }
      bal = qty3(bal + inn - out);
      rows.push({ date: e.date === '0000-00-00' ? '' : e.date, kind: e.k, label, in: inn, out, balance: bal, ref, partyId, invId: e.inv ? e.inv.id : '' });
    });
    return { rows, balance: bal };
  }
  // الأكثر مبيعًا: صافي الكمية (بيع − مرتجع بيع) وصافي قيمة البيع للفترة
  function bestSellers(st, from, to) {
    const m = {};
    st.invoices.forEach((inv) => {
      if (inv.voided || inv.archived || (inv.type !== 'sale' && inv.type !== 'sale_return')) return;
      if ((from && inv.date < from) || (to && inv.date > to)) return;
      const sg = inv.type === 'sale' ? 1 : -1;
      inv.lines.forEach((ln) => { const r = m[ln.itemId] || (m[ln.itemId] = { itemId: ln.itemId, name: ln.name, qty: 0, amount: 0, invoices: new Set() }); r.qty = qty3(r.qty + sg * ln.qty); r.amount += sg * ln.net; r.invoices.add(inv.id); });
    });
    return Object.values(m).map((r) => ({ itemId: r.itemId, name: (st.items.find((i) => i.id === r.itemId) || {}).name || r.name, qty: r.qty, amount: r.amount, invoices: r.invoices.size })).filter((r) => r.qty > 0).sort((a, b) => b.qty - a.qty || b.amount - a.amount);
  }
  function lowStockItems(st) {
    const inv = computeInventory(st);
    return st.items.filter((i) => !i.deleted && i.minQty > 0 && inv.per[i.id] && inv.per[i.id].qty <= i.minQty).map((i) => ({ item: i, qty: inv.per[i.id].qty, minQty: i.minQty })).sort((a, b) => a.qty - b.qty);
  }
  function availableQty(st, itemId, excludeInvoiceId) {
    const clone = excludeInvoiceId ? { ...st, invoices: st.invoices.filter((i) => i.id !== excludeInvoiceId) } : st;
    const inv = computeInventory(clone);
    return inv.per[itemId] ? inv.per[itemId].qty : 0;
  }

  /* ---------- الشركاء المتعددون ورأس المال ---------- */
  // «أنا» (المالك) شريك في جدول رأس المال فقط. الشريك الافتراضي «الشريك» يحمل كل حركات الحساب الجاري القديمة (التي لا تحمل معرّف شريك).
  const OWNER_ID = 'PRT-OWN';
  function ensurePartners(st) {
    let changed = false;
    if (!Array.isArray(st.partners)) { st.partners = []; changed = true; }
    if (!Array.isArray(st.partnerCapital)) { st.partnerCapital = []; changed = true; }
    if (!st.counters) st.counters = {};
    if (st.counters.PRT == null) st.counters.PRT = 0; if (st.counters.CAP == null) st.counters.CAP = 0;
    if (!st.partners.some((p) => p.owner)) { st.partners.unshift({ id: OWNER_ID, name: (st.settings && st.settings.userName) || 'أنا', owner: true, phone: '', notes: '', createdAt: new Date().toISOString() }); changed = true; }
    if (!st.partners.some((p) => !p.owner)) { st.partners.push({ id: 'PRT-' + nextNo(st, 'PRT', 4), name: 'الشريك', owner: false, isDefault: true, phone: '', notes: '', createdAt: new Date().toISOString() }); changed = true; }
    return changed;
  }
  const livePartners = (st) => (st.partners || []).filter((p) => !p.deleted);
  const ownerPartner = (st) => (st.partners || []).find((p) => p.owner) || { id: OWNER_ID, name: 'أنا', owner: true };
  function defaultPartnerId(st) { const l = livePartners(st).filter((p) => !p.owner); const d = l.find((p) => p.isDefault) || l[0]; return d ? d.id : null; }
  const PARTNER_TXN = ['give_partner', 'recv_partner', 'partner_adjust'];
  const isPartnerTxn = (t) => PARTNER_TXN.includes(t.type) || (t.type === 'expense' && (t.partnerEffectAmount > 0 || t.paidBy === 'partner'));
  const partnerOf = (st, t) => (t.partnerId || defaultPartnerId(st));
  function addPartner(st, p) {
    ensurePartners(st);
    const name = String((p && p.name) || '').trim(); if (!name) fail('اسم الشريك مطلوب');
    if (livePartners(st).some((x) => x.name.trim() === name)) fail('يوجد شريك بنفس الاسم.');
    const part = { id: 'PRT-' + nextNo(st, 'PRT', 4), name, owner: false, phone: String(p.phone || ''), notes: String(p.notes || ''), createdAt: new Date().toISOString() };
    st.partners.push(part); log(st, 'إضافة شريك', part.id, name, { new: { name, phone: part.phone, notes: part.notes } }); return part;
  }
  function updatePartner(st, id, patch) {
    const p = st.partners.find((x) => x.id === id && !x.deleted); if (!p) fail('الشريك غير موجود');
    const old = { name: p.name, phone: p.phone, notes: p.notes };
    if (patch.name !== undefined) { const n = String(patch.name).trim(); if (!n) fail('اسم الشريك مطلوب'); if (livePartners(st).some((x) => x.id !== id && x.name.trim() === n)) fail('يوجد شريك بنفس الاسم.'); p.name = n; }
    if (patch.phone !== undefined) p.phone = String(patch.phone); if (patch.notes !== undefined) p.notes = String(patch.notes);
    log(st, 'تعديل شريك', id, p.name, { old, new: { name: p.name, phone: p.phone, notes: p.notes } }); return p;
  }
  function partnerUsage(st, id) {
    const txns = st.txns.filter((t) => !t.voided && isPartnerTxn(t) && partnerOf(st, t) === id).length;
    const capital = (st.partnerCapital || []).filter((c) => !c.voided && c.partnerId === id).length;
    return { txns, capital, used: txns > 0 || capital > 0 };
  }
  function deletePartner(st, id) {
    const p = st.partners.find((x) => x.id === id && !x.deleted); if (!p) fail('الشريك غير موجود');
    if (p.owner) fail('لا يمكن حذف حسابك أنت من قائمة الشركاء.');
    const u = partnerUsage(st, id);
    if (u.used) fail('لا يمكن حذف «' + p.name + '» لأن له ' + u.capital + ' حركة رأس مال و' + u.txns + ' حركة في حسابه الجاري. احذف حركاته أولًا.');
    p.deleted = true; p.deletedAt = new Date().toISOString(); log(st, 'حذف شريك', id, p.name, { old: { name: p.name } }); recycleAdd(st, 'partner', id); return p;
  }
  function addCapital(st, c) {
    ensurePartners(st);
    const p = st.partners.find((x) => x.id === c.partnerId && !x.deleted); if (!p) fail('اختر الشريك');
    const amount = toQ(c.amount); if (!(amount > 0)) fail('مبلغ رأس المال يجب أن يكون أكبر من صفر'); if (!c.date) fail('التاريخ مطلوب');
    const row = { id: 'CAP-' + nextNo(st, 'CAP', 4), partnerId: p.id, date: c.date, amount, note: String(c.note || ''), voided: false, seq: seqOf(st), createdAt: new Date().toISOString() };
    st.partnerCapital.push(row); log(st, 'رأس مال شريك', row.id, p.name + ' ' + toP(amount), { new: { partnerId: p.id, date: row.date, amount, note: row.note } }); return row;
  }
  function editCapital(st, id, d) {
    const r = (st.partnerCapital || []).find((x) => x.id === id); if (!r || r.voided) fail('حركة رأس المال غير موجودة');
    const p = st.partners.find((x) => x.id === (d.partnerId || r.partnerId) && !x.deleted); if (!p) fail('اختر الشريك');
    const amount = toQ(d.amount); if (!(amount > 0)) fail('مبلغ رأس المال يجب أن يكون أكبر من صفر'); if (!d.date) fail('التاريخ مطلوب');
    const old = { partnerId: r.partnerId, date: r.date, amount: r.amount, note: r.note };
    r.partnerId = p.id; r.date = d.date; r.amount = amount; r.note = String(d.note || ''); r.revision = (r.revision || 0) + 1; r.editedAt = new Date().toISOString();
    log(st, 'تعديل رأس مال', id, p.name + ' ' + toP(amount), { old, new: { partnerId: r.partnerId, date: r.date, amount, note: r.note } }); return r;
  }
  function voidCapital(st, id) {
    const r = (st.partnerCapital || []).find((x) => x.id === id); if (!r || r.voided) fail('حركة رأس المال غير موجودة');
    r.voided = true; r.voidedAt = new Date().toISOString(); log(st, 'حذف رأس مال', id, toP(r.amount), { old: { partnerId: r.partnerId, amount: r.amount, date: r.date } }); recycleAdd(st, 'capital', id); return r;
  }
  // توزيع مبلغ صحيح (بالقروش) على أوزان بحيث يكون المجموع مطابقًا تمامًا للمبلغ (أكبر باقي)
  function distribute(total, weights) {
    const sum = weights.reduce((a, b) => a + b, 0); if (!sum) return weights.map(() => 0);
    const sg = total < 0 ? -1 : 1, T = Math.abs(total); const raw = weights.map((w) => (T * w) / sum); const fl = raw.map(Math.floor);
    let rem = T - fl.reduce((a, b) => a + b, 0);
    raw.map((r, i) => ({ i, f: r - fl[i] })).sort((a, b) => b.f - a.f || a.i - b.i).forEach((o) => { if (rem > 0) { fl[o.i] += 1; rem -= 1; } });
    return fl.map((x) => sg * x);
  }
  // رأس المال ونسب الشركاء (تُحسب دائمًا من السجل؛ لا نسب تُدخل يدويًا)
  function capitalSummary(st) {
    const rows = livePartners(st).map((p) => ({ partner: p, capital: 0, entries: 0 }));
    (st.partnerCapital || []).forEach((c) => { if (c.voided) return; const r = rows.find((x) => x.partner.id === c.partnerId); if (r) { r.capital += c.amount; r.entries += 1; } });
    const total = rows.reduce((s, r) => s + r.capital, 0);
    rows.forEach((r) => { r.pct = total ? (r.capital * 100) / total : 0; });
    return { rows, total, count: rows.filter((r) => r.capital > 0).length, active: total > 0 };
  }
  // نصيب كل شريك من صافي الربح. بلا رأس مال مسجّل يعمل النظام القديم كما كان (نسبتي من الإعدادات والباقي للشريك الافتراضي).
  function profitShares(st, net) {
    const cs = capitalSummary(st); const paidBy = {};
    st.txns.forEach((t) => { if (!t.voided && t.type === 'give_partner' && t.nature === 'his_share') { const id = partnerOf(st, t); paidBy[id] = (paidBy[id] || 0) + t.amount; } });
    if (cs.active) {
      const parts = cs.rows.filter((r) => r.capital > 0); const amts = distribute(net, parts.map((r) => r.capital));
      return { source: 'capital', rows: cs.rows.map((r) => { const k = parts.indexOf(r); return { partner: r.partner, capital: r.capital, pct: r.pct, share: k >= 0 ? amts[k] : 0, paid: paidBy[r.partner.id] || 0 }; }) };
    }
    const mine = Math.round(net * st.settings.myShare / 100); const own = ownerPartner(st); const dp = defaultPartnerId(st);
    const rows = [{ partner: own, capital: 0, pct: st.settings.myShare, share: mine, paid: 0 }];
    livePartners(st).filter((p) => !p.owner).forEach((p) => rows.push({ partner: p, capital: 0, pct: p.id === dp ? 100 - st.settings.myShare : 0, share: p.id === dp ? net - mine : 0, paid: paidBy[p.id] || 0 }));
    return { source: 'manual', rows };
  }

  /* ---------- سلف مستقلة (أشخاص خارج العملاء والموردين) ---------- */
  // أربعة أنواع حركات: أعطيته سلفة / أخذت منه سلفة / سداد منه لي / سداد مني له. تؤثر على النقد فقط، ولا تدخل في أرصدة العملاء والموردين ولا الأرباح.
  const LOAN_TYPES = ['loan_give', 'loan_take', 'loan_recv', 'loan_pay'];
  function loanTotals(st, partyId, skipId) {
    const r = { given: 0, recvd: 0, taken: 0, paid: 0 };
    st.txns.forEach((t) => { if (t.voided || t.partyId !== partyId || t.id === skipId) return; if (t.type === 'loan_give') r.given += t.amount; else if (t.type === 'loan_recv') r.recvd += t.amount; else if (t.type === 'loan_take') r.taken += t.amount; else if (t.type === 'loan_pay') r.paid += t.amount; });
    r.givenLeft = r.given - r.recvd; r.takenLeft = r.taken - r.paid; return r;
  }
  const loansValid = (st) => { const ids = new Set(st.txns.filter((t) => LOAN_TYPES.includes(t.type) && !t.voided).map((t) => t.partyId)); for (const id of ids) { const r = loanTotals(st, id); if (r.givenLeft < 0 || r.takenLeft < 0) return false; } return true; };
  function addLoanPerson(st, p) {
    const name = String((p && p.name) || '').trim(); if (!name) fail('اسم الشخص مطلوب');
    const dup = st.parties.find((x) => !x.deleted && x.name.trim() === name);
    if (dup) return { party: dup, existed: true };
    const id = 'PTY-' + nextNo(st, 'PTY', 4);
    const party = { id, name, phone: String(p.phone || ''), address: '', notes: String(p.notes || ''), kind: 'both', loanOnly: true, opening: 0, createdAt: new Date().toISOString() };
    st.parties.push(party); log(st, 'إضافة شخص (سلف)', id, name, { new: partyBrief(party) }); return { party, existed: false };
  }
  const isTradeParty = (p) => !p.deleted && !p.loanOnly;
  function loanStatement(st, partyId) {
    const party = st.parties.find((p) => p.id === partyId); if (!party) fail('الشخص غير موجود');
    const rows = st.txns.filter((t) => !t.voided && t.partyId === partyId && LOAN_TYPES.includes(t.type)).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq));
    let gl = 0, tl = 0;
    const out = rows.map((t) => { if (t.type === 'loan_give') gl += t.amount; else if (t.type === 'loan_recv') gl -= t.amount; else if (t.type === 'loan_take') tl += t.amount; else tl -= t.amount; return { id: t.id, date: t.date, type: t.type, label: TXN_LABELS[t.type], amount: t.amount, acc: t.acc, note: t.note, givenLeft: gl, takenLeft: tl }; });
    return { party, rows: out, totals: loanTotals(st, partyId) };
  }
  function loanOverview(st) {
    const ids = [...new Set(st.txns.filter((t) => !t.voided && LOAN_TYPES.includes(t.type)).map((t) => t.partyId))];
    const people = ids.map((id) => { const party = st.parties.find((p) => p.id === id); if (!party) return null; const t = loanTotals(st, id); const last = st.txns.filter((x) => !x.voided && x.partyId === id && LOAN_TYPES.includes(x.type)).reduce((m, x) => (x.date > m ? x.date : m), ''); const firstOpen = st.txns.filter((x) => !x.voided && x.partyId === id && (x.type === 'loan_give' || x.type === 'loan_take')).reduce((m, x) => (!m || x.date < m ? x.date : m), ''); return Object.assign({ party, last, firstOpen }, t); }).filter(Boolean);
    const sum = (k) => people.reduce((s, p) => s + p[k], 0);
    return { people, totals: { given: sum('given'), recvd: sum('recvd'), givenLeft: sum('givenLeft'), taken: sum('taken'), paid: sum('paid'), takenLeft: sum('takenLeft') } };
  }

  /* ---------- الحركات المالية ---------- */
  function seqOf(st) { return (st._seq = (st._seq || 0) + 1); }
  function reseq(st) {
    // يضمن ترتيبًا ثابتًا للحركات المتقاربة في التاريخ
    let m = 0;
    [...st.invoices, ...st.txns, ...st.adjustments].forEach((x) => { if (x.seq > m) m = x.seq; });
    st._seq = m;
  }

  const PARTNER_NATURE = {
    give: {
      advance: { label: 'سلفة مستحقة لي عنده', effect: 1 },
      funding: { label: 'تمويل له (مستحق لي)', effect: 1 },
      settle: { label: 'سداد لدين عليّ له', effect: 1 },
      his_share: { label: 'سحب من نصيبه من الأرباح', effect: 0, paidToPartnerProfit: true },
      other: { label: 'أخرى (أحدد الأثر)', effect: null },
    },
    recv: {
      repay: { label: 'سداد لدين سابق له عندي', effect: -1 },
      advance_to_me: { label: 'سلفة منه لي (مستحقة عليّ له)', effect: -1 },
      profit: { label: 'أرباح مستحقة لي', effect: 0, profitReceived: true },
      other: { label: 'تسوية أخرى (أحدد الأثر)', effect: null },
    },
    contribute: { capital: 'رأس مال', loan: 'قرض مني للتجارة', other: 'أخرى' },
    withdraw: { profit: 'سحب من أرباحي', capital: 'استرداد رأس مال', loan: 'سداد قرض لي', other: 'أخرى' },
  };

  const TXN_LABELS = {
    receipt: 'قبض من عميل', payment: 'دفع لمورد', expense: 'مصروف', transfer: 'تحويل بين حساباتي',
    contribute: 'أضفت من مالي للتجارة', withdraw: 'سحب من التجارة لحسابي',
    give_partner: 'مبلغ أعطيته لشريكي', recv_partner: 'مبلغ استلمته من شريكي',
    partner_adjust: 'تسوية مع الشريك (بدون نقدية)', profit_approve: 'اعتماد أرباح لي', opening: 'رصيد افتتاحي',
    other_in: 'حركة أخرى (داخل)', other_out: 'حركة أخرى (خارج)', personal_draw: 'سحب شخصي من النشاط',
    loan_give: 'سلفة أعطيتها', loan_take: 'سلفة أخذتها', loan_recv: 'سداد سلفة (استلمته)', loan_pay: 'سداد سلفة (دفعته)',
  };

  function addTxn(st, t) {
    const type = t.type;
    if (!TXN_LABELS[type]) fail('نوع الحركة غير معروف');
    const amount = toQ(t.amount);
    if (!(amount > 0)) fail('المبلغ يجب أن يكون أكبر من صفر');
    if (!t.date) fail('التاريخ مطلوب');
    const txn = {
      id: 'T-' + nextNo(st, 'T', 5), no: null, date: t.date, type, amount,
      acc: t.acc || 'trade', toAcc: t.toAcc || null, partyId: t.partyId || null, invoiceId: t.invoiceId || null,
      method: t.method || 'cash', note: t.note || '', nature: t.nature || null, category: t.category || null, loanType: LOAN_TYPES.includes(t.type) ? cleanName(t.loanType) : undefined,
      scope: t.scope || null, paidBy: t.paidBy || null, partnerEffectAmount: 0, partnerEffectSign: 0, partnerId: null,
      auto: !!t.auto, voided: false, seq: seqOf(st), createdAt: new Date().toISOString(),
    };
    txn.no = txn.id;
    if (!ACCOUNTS[txn.acc]) fail('الحساب غير معروف');
    if (txn.toAcc && !ACCOUNTS[txn.toAcc]) fail('الحساب المستفيد غير معروف');
    if (type === 'opening') {
      if (activeOpening(st, txn.acc)) fail('يوجد رصيد افتتاحي لهذا الحساب بالفعل. عدّله من شاشة الرصيد الافتتاحي بدل إضافة رصيد ثانٍ.');
      txn.nature = WORK_ACCS.includes(txn.acc) ? 'work_opening' : 'personal_opening';
    }
    const needParty = ['receipt', 'payment'].includes(type);
    if (needParty && !txn.partyId && !txn.invoiceId) fail('اختر الطرف');
    if (needParty && txn.partyId && !st.parties.find((p) => p.id === txn.partyId)) fail('الطرف غير موجود');
    if (type === 'transfer') {
      if (!txn.toAcc || txn.toAcc === txn.acc) fail('اختر حسابين مختلفين للتحويل');
    }
    if (type === 'contribute') { txn.acc = 'personal'; txn.toAcc = 'trade'; if (!txn.nature) fail('حدد طبيعة المبلغ: رأس مال أم قرض'); }
    if (type === 'withdraw') { txn.acc = 'trade'; txn.toAcc = 'personal'; if (!txn.nature) fail('حدد طبيعة السحب'); }
    if (type === 'withdraw' && txn.nature === 'loan' && !t._skipLoanCheck) {
      const left = loanBalance(st);
      if (amount > left) fail(left > 0 ? 'مبلغ الاسترداد أكبر من المتبقي من سلفتك للنشاط (' + toP(left) + ').' : 'لا توجد سلفة مستحقة لك على النشاط لاستردادها. سجّل السلفة أولًا.');
    }
    if (type === 'give_partner') {
      const n = PARTNER_NATURE.give[txn.nature]; if (!n) fail('حدد طبيعة المبلغ الذي أعطيته لشريكك');
      if (n.effect === null) { txn.partnerEffectSign = (t.effectSign === '' || t.effectSign == null) ? NaN : Number(t.effectSign); if (![1, -1, 0].includes(txn.partnerEffectSign)) fail('حدد أثر الحركة على الرصيد'); if (!txn.note) fail('اكتب بيان الحركة'); }
      else txn.partnerEffectSign = n.effect;
    }
    if (type === 'recv_partner') {
      const n = PARTNER_NATURE.recv[txn.nature]; if (!n) fail('حدد طبيعة المبلغ الذي استلمته من شريكك');
      if (n.effect === null) { txn.partnerEffectSign = (t.effectSign === '' || t.effectSign == null) ? NaN : Number(t.effectSign); if (![1, -1, 0].includes(txn.partnerEffectSign)) fail('حدد أثر الحركة على الرصيد'); if (!txn.note) fail('اكتب بيان الحركة'); }
      else txn.partnerEffectSign = n.effect;
    }
    if (type === 'partner_adjust') {
      txn.partnerEffectSign = (t.effectSign === '' || t.effectSign == null) ? NaN : Number(t.effectSign);
      if (![1, -1].includes(txn.partnerEffectSign)) fail('حدد هل التسوية تزيد مستحقاتي أم تقللها');
      if (!txn.note) fail('اكتب بيان التسوية');
    }
    if (type === 'expense') {
      if (!txn.category) fail('اختر نوع المصروف');
      if (!['me', 'partner'].includes(txn.paidBy)) fail('حدد من دفع المصروف');
      if (!['trade', 'partner'].includes(txn.scope)) fail('حدد الجهة التي يخصها المصروف');
      if (txn.paidBy === 'partner' && txn.scope === 'partner') fail('مصروف شريكك الخاص الذي دفعه بنفسه لا يخصك');
      const owed = toQ(t.partnerAmount || 0);
      if (owed < 0 || owed > amount) fail('المبلغ المستحق بينكما لا يزيد عن مبلغ المصروف');
      txn.partnerEffectAmount = owed;
      // دفعته أنا: الشريك يدين لي (+)  | دفعه الشريك: أنا أدين له (-)
      txn.partnerEffectSign = txn.paidBy === 'me' ? 1 : -1;
    }
    if (type === 'other_in' || type === 'other_out') { if (!txn.note) fail('اكتب بيان الحركة'); }
    // سحب شخصي: مبلغ يخرج من حساب من حسابات النشاط لاستخدامي الشخصي. ليس مصروفًا تشغيليًا ولا دينًا على أحد ولا يدخل في حساب الربح.
    if (type === 'personal_draw') {
      if (!WORK_ACCS.includes(txn.acc)) fail('اختر الحساب الذي خرج منه المبلغ من حسابات النشاط');
      if (!txn.note) fail('اكتب سبب السحب');
      txn.memo = String(t.memo || '');
    }
    if (LOAN_TYPES.includes(type)) {
      if (!txn.partyId) fail('اختر الشخص'); if (!st.parties.find((p) => p.id === txn.partyId && !p.deleted)) fail('الشخص غير موجود');
      if (!t._skipLoanCheck) {
        const lt = loanTotals(st, txn.partyId);
        if (type === 'loan_recv' && amount > lt.givenLeft) fail(lt.givenLeft > 0 ? 'مبلغ السداد أكبر من المتبقي من السلفة (' + toP(lt.givenLeft) + ').' : 'لا توجد سلفة مستحقة لك عند هذا الشخص لسدادها.');
        if (type === 'loan_pay' && amount > lt.takenLeft) fail(lt.takenLeft > 0 ? 'مبلغ السداد أكبر من المتبقي من السلفة عليك (' + toP(lt.takenLeft) + ').' : 'لا توجد سلفة عليك لهذا الشخص لسدادها.');
      }
    }
    if (isPartnerTxn(txn)) {
      txn.partnerId = t.partnerId || defaultPartnerId(st); if (!txn.partnerId) fail('أضف شريكًا أولًا من قسم الشركاء');
      const pp = st.partners.find((x) => x.id === txn.partnerId && !x.deleted && !x.owner); if (!pp) fail('الشريك غير موجود');
    }
    if (t.guardDup && !txn.auto) {
      const dup = st.txns.slice(-8).find((x) => !x.voided && !x.auto && x.type === txn.type && x.amount === txn.amount && x.date === txn.date && x.acc === txn.acc && (x.partyId || '') === (txn.partyId || '') && (x.invoiceId || '') === (txn.invoiceId || '') && (x.nature || '') === (txn.nature || '') && Date.now() - Date.parse(x.createdAt) < 60000);
      if (dup) fail('تم تسجيل نفس الحركة قبل لحظات (' + dup.id + '). لم يُسجَّل شيء حتى لا تتكرر. إن كانت حركة ثانية فعلًا فانتظر دقيقة أو غيّر البيان.');
    }
    st.txns.push(txn);
    log(st, 'تسجيل حركة', txn.id, TXN_LABELS[type] + ' ' + toP(amount), { new: txnBrief(txn) });
    return txn;
  }

  // أثر الحركة (يُحسب دائمًا من السجل)
  function txnEffect(t) {
    const e = { cash: { trade: 0, bank: 0, wallet: 0, personal: 0 }, party: 0, partner: 0, profitReceived: 0, profitApproved: 0, paidToPartnerProfit: 0 };
    if (t.voided) return e;
    const a = t.amount;
    switch (t.type) {
      case 'opening': e.cash[t.acc] += a; break;
      case 'receipt': e.cash[t.acc] += a; e.party = -a; break;
      case 'payment': e.cash[t.acc] -= a; e.party = a; break;
      case 'transfer': e.cash[t.acc] -= a; e.cash[t.toAcc] += a; break;
      case 'contribute': e.cash.personal -= a; e.cash.trade += a; break;
      case 'withdraw': e.cash.trade -= a; e.cash.personal += a; if (t.nature === 'profit') e.profitReceived = a; break;
      case 'give_partner': e.cash[t.acc] -= a; e.partner = t.partnerEffectSign * a;
        if (t.nature === 'his_share') e.paidToPartnerProfit = a; break;
      case 'recv_partner': e.cash[t.acc] += a; e.partner = t.partnerEffectSign * a;
        if (t.nature === 'profit') e.profitReceived = a; break;
      case 'partner_adjust': e.partner = t.partnerEffectSign * a; break;
      case 'profit_approve': e.profitApproved = a; break;
      case 'expense':
        if (t.paidBy === 'me') e.cash[t.acc] -= a;
        e.partner = t.partnerEffectSign * t.partnerEffectAmount; break;
      case 'other_in': e.cash[t.acc] += a; break;
      case 'other_out': e.cash[t.acc] -= a; break;
      case 'personal_draw': e.cash[t.acc] -= a; break;
      case 'loan_give': e.cash[t.acc] -= a; break;
      case 'loan_take': e.cash[t.acc] += a; break;
      case 'loan_recv': e.cash[t.acc] += a; break;
      case 'loan_pay': e.cash[t.acc] -= a; break;
    }
    return e;
  }

  function voidTxn(st, id, reason) {
    const t = st.txns.find((x) => x.id === id); if (!t) fail('الحركة غير موجودة');
    if (t.voided) fail('الحركة ملغاة بالفعل');
    if (t.invoiceId && t.auto) fail('هذه حركة مرتبطة بفاتورة. عدّل الفاتورة أو ألغها بدل إلغاء الحركة.');
    t.voided = true; t.voidReason = reason || ''; t.voidedAt = new Date().toISOString();
    if (loanBalance(st) < 0) { t.voided = false; t.voidReason = ''; delete t.voidedAt; fail('لا يمكن حذف هذه السلفة لأنه سُجّل عليها استرداد. احذف أو عدّل الاسترداد أولًا.'); }
    if (!loansValid(st)) { t.voided = false; t.voidReason = ''; delete t.voidedAt; fail('لا يمكن حذف هذه الحركة لأن سدادًا مسجلًا على هذه السلفة. احذف أو عدّل السداد أولًا.'); }
    log(st, 'حذف حركة', id, (TXN_LABELS[t.type] || '') + (reason ? ' — ' + reason : ''), { old: txnBrief(t) });
    recycleAdd(st, 'txn', id);
    return t;
  }

  // تعديل حركة بنفس المعرّف: تُتحقق القيم الجديدة بنفس قواعد الإضافة، ثم تُستبدل قيم الحركة نفسها (لا حركة ثانية)،
  // وكل الأرصدة (خزنة، شريك، طرف، أرباح) تُحسب من السجل فلا يبقى أي أثر للقيم القديمة ولا يتكرر.
  // الأنواع التي يجوز التبديل بينها عند التعديل (نفس طبيعة المعاملة)
  const TXN_FAMILIES = [['give_partner', 'recv_partner', 'partner_adjust'], ['other_in', 'other_out'], ['contribute', 'withdraw'], ['receipt', 'payment'], ['loan_give', 'loan_take'], ['loan_recv', 'loan_pay']];
  function txnFamily(type) { return TXN_FAMILIES.find((f) => f.includes(type)) || [type]; }
  function editTxn(st, id, d, reason) {
    const t = st.txns.find((x) => x.id === id); if (!t) fail('الحركة غير موجودة');
    if (t.voided) fail('لا يمكن تعديل حركة محذوفة');
    if (t.auto) fail('هذه الحركة جزء من فاتورة. عدّل الفاتورة نفسها بدل تعديل الحركة.');
    if (t.type === 'opening') fail('الرصيد الافتتاحي يُعدَّل من شاشة الرصيد الافتتاحي.');
    const old = txnBrief(t);
    const nType = d.type && d.type !== t.type && txnFamily(t.type).includes(d.type) ? d.type : t.type;
    const keep = { counters: JSON.stringify(st.counters), seq: st._seq, audit: st.audit.length, n: st.txns.length };
    let nt;
    const d2 = Object.assign({}, d); if (d2.partnerId === undefined || d2.partnerId === '') delete d2.partnerId;
    try { nt = addTxn(st, Object.assign({ partnerId: t.partnerId }, d2, { type: nType, _skipLoanCheck: true })); }
    finally { if (st.txns.length > keep.n) st.txns.length = keep.n; st.counters = JSON.parse(keep.counters); st._seq = keep.seq; st.audit.length = keep.audit; }
    if (t.invoiceId) { nt.partyId = t.partyId; }
    const KEYS = ['type', 'date', 'amount', 'acc', 'toAcc', 'partyId', 'method', 'note', 'nature', 'category', 'loanType', 'scope', 'paidBy', 'partnerEffectAmount', 'partnerEffectSign', 'partnerId'];
    if (nt.memo !== undefined || t.memo !== undefined) KEYS.push('memo');
    const before = {}; KEYS.forEach((k) => { before[k] = t[k]; });
    KEYS.forEach((k) => { t[k] = nt[k]; });
    if (loanBalance(st) < 0) { KEYS.forEach((k) => { t[k] = before[k]; }); fail('هذا التعديل يجعل المسترد أكبر من السلفة. عدّل مبلغ الاسترداد أو السلفة بما يتناسب.'); }
    if (!loansValid(st)) { KEYS.forEach((k) => { t[k] = before[k]; }); fail('هذا التعديل يجعل المسدد أكبر من السلفة. عدّل مبلغ السداد أو السلفة بما يتناسب.'); }
    t.revision = (t.revision || 0) + 1; t.editedAt = new Date().toISOString();
    log(st, 'تعديل حركة', id, (TXN_LABELS[t.type] || '') + (reason ? ' — ' + reason : ''), { old, new: txnBrief(t) });
    return t;
  }

  /* ---------- الفواتير ---------- */
  function normalizeLines(st, type, lines) {
    if (!lines || !lines.length) fail('أضف صنفًا واحدًا على الأقل');
    return lines.map((l, i) => {
      const item = st.items.find((x) => x.id === l.itemId); if (!item) fail('صنف غير موجود في السطر ' + (i + 1));
      const qty = qty3(l.qty); if (!(qty > 0)) fail('الكمية يجب أن تكون أكبر من صفر: ' + item.name);
      const unit = toQ(l.unit); if (unit < 0) fail('السعر غير صحيح: ' + item.name);
      const discount = toQ(l.discount || 0); // خصم على السطر بالمبلغ
      const gross = Math.round(qty * unit);
      if (discount < 0 || discount > gross) fail('الخصم أكبر من إجمالي الصنف: ' + item.name);
      return { itemId: item.id, name: item.name, qty, unit, discount, net: gross - discount };
    });
  }

  function createInvoice(st, d, opts) {
    opts = opts || {};
    const meta = INVOICE_TYPES[d.type]; if (!meta) fail('نوع الفاتورة غير معروف');
    if (!d.date) fail('التاريخ مطلوب');
    if (!d.partyId) fail('اختر الطرف');
    const party = st.parties.find((p) => p.id === d.partyId); if (!party) fail('الطرف غير موجود');
    const lines = normalizeLines(st, d.type, d.lines);
    const sub = lines.reduce((s, l) => s + l.net, 0);
    const extraDiscount = toQ(d.discount || 0);
    if (extraDiscount < 0 || extraDiscount > sub) fail('خصم الفاتورة غير صحيح');
    const total = sub - extraDiscount;
    // طريقة الدفع: كاش = مدفوعة بالكامل، آجل = لا شيء مدفوع، دفع جزئي = المبلغ المكتوب فقط. (بدونها يعمل المحرك كما كان)
    const payMode = d.payMode || null;
    if (payMode && !['cash', 'credit', 'partial'].includes(payMode)) fail('طريقة الدفع غير معروفة');
    let paid = toQ(d.paid || 0);
    if (payMode === 'partial') {
      if (paid < 0) fail('المبلغ المدفوع لا يمكن أن يكون سالبًا');
      if (!(paid > 0)) fail('اكتب المبلغ الذي تم دفعه فعلًا');
    }
    if (payMode === 'cash') paid = total;
    if (payMode === 'credit') paid = 0;
    if (paid < 0) fail('المبلغ المدفوع غير صحيح');
    if (paid > total) fail('المبلغ المدفوع أكبر من إجمالي الفاتورة. سجّل الزيادة كقبض/دفع منفصل.');
    // مصروفات الفاتورة (نقل، تحميل...): تُسجَّل كمصروفات عادية مرتبطة بالفاتورة، ولا تغيّر إجمالي الفاتورة ولا المخزون ولا تكلفة الأصناف
    const expenses = (d.expenses || []).filter((x) => x && (String(x.amount || '').trim() !== '' || x.category)).map((x, i) => {
      const amount = toQ(x.amount); if (!(amount > 0)) fail('مبلغ مصروف الفاتورة رقم ' + (i + 1) + ' يجب أن يكون أكبر من صفر');
      const category = String(x.category || '').trim(); if (!category) fail('اختر نوع مصروف الفاتورة رقم ' + (i + 1));
      const paidBy = x.paidBy === 'partner' ? 'partner' : 'me'; const acc = ACCOUNTS[x.acc] ? x.acc : (d.acc && ACCOUNTS[d.acc] ? d.acc : 'trade');
      return { category, amount, note: String(x.note || ''), paidBy, acc, partnerId: paidBy === 'partner' ? (x.partnerId || null) : null };
    });
    const inv = {
      id: opts.reuseId || (meta.prefix + '-' + nextNo(st, meta.prefix, 4)), type: d.type, date: d.date, partyId: d.partyId,
      lines, subtotal: sub, discount: extraDiscount, total, paid, remaining: total - paid,
      method: d.method || 'cash', payMode, acc: d.acc || 'trade', note: d.note || '', refInvoice: d.refInvoice || null, expenses,
      voided: false, revision: opts.revision || 0, seq: opts.keepSeq || seqOf(st), createdAt: new Date().toISOString(),
    };
    inv.no = inv.id;
    // منع البيع بأكثر من المتاح
    if (['sale', 'purchase_return'].includes(d.type) && !st.settings.allowNegativeStock) {
      const probe = { ...st, invoices: [...st.invoices, inv] };
      const bad = computeInventory(probe).negatives.find((n) => n.invoice === inv.no);
      if (bad) {
        const it = st.items.find((x) => x.id === bad.itemId);
        const have = availableQty(st, bad.itemId, opts.reuseId ? inv.id : null);
        fail('الكمية المتاحة من "' + (it ? it.name : '') + '" غير كافية (المتاح ' + have + '). يمكنك السماح بالمخزون السالب من الإعدادات.');
      }
    }
    st.invoices.push(inv);
    if (paid > 0) {
      const incoming = d.type === 'sale' || d.type === 'purchase_return';
      addTxn(st, {
        type: incoming ? 'receipt' : 'payment', date: d.date, amount: toP(paid), acc: inv.acc, partyId: inv.partyId,
        invoiceId: inv.id, method: inv.method, note: meta.label + ' ' + inv.no, auto: true,
      });
    }
    expenses.forEach((x) => {
      addTxn(st, { type: 'expense', date: d.date, amount: toP(x.amount), acc: x.paidBy === 'partner' ? 'trade' : x.acc, category: x.category, paidBy: x.paidBy, scope: 'trade', partnerAmount: x.paidBy === 'partner' ? toP(x.amount) : 0, partnerId: x.partnerId, invoiceId: inv.id, method: inv.method, note: x.note, auto: true });
    });
    if (!opts.silent) log(st, 'اعتماد ' + meta.label, inv.id, 'إجمالي ' + toP(total), { new: invBrief(inv) });
    return inv;
  }

  function voidInvoice(st, id, reason, silent) {
    const inv = st.invoices.find((x) => x.id === id); if (!inv) fail('الفاتورة غير موجودة');
    if (inv.voided) fail('الفاتورة محذوفة بالفعل');
    if (!st.settings.allowNegativeStock) {
      const key = (n) => n.itemId + '|' + n.invoice;
      const beforeKeys = new Set(computeInventory(st).negatives.map(key));
      const probe = { ...st, invoices: st.invoices.map((i) => (i.id === id ? { ...i, voided: true } : i)) };
      const bad = computeInventory(probe).negatives.find((n) => !beforeKeys.has(key(n)));
      if (bad) { const it = st.items.find((x) => x.id === bad.itemId); fail('لا يمكن حذف هذه الفاتورة، لأن الكمية التي أدخلتها من "' + (it ? it.name : '') + '" بِيعت بعدها (الفاتورة ' + bad.invoice + '). عدّل أو احذف تلك الفاتورة أولًا، أو فعّل المخزون السالب من الإعدادات.'); }
    }
    inv.voided = true; inv.voidReason = reason || ''; inv.voidedAt = new Date().toISOString();
    st.txns.forEach((t) => { if (t.invoiceId === id && !t.voided) { t.voided = true; t.voidReason = 'حذف الفاتورة ' + id; } });
    if (!silent) { log(st, 'حذف فاتورة', id, reason || '', { old: invBrief(inv) }); recycleAdd(st, 'invoice', id); }
    return inv;
  }

  // تعديل = إلغاء النسخة القديمة وحفظ نسخة جديدة بنفس الرقم (بدون تكرار الأثر)
  function editInvoice(st, id, d) {
    const old = st.invoices.find((x) => x.id === id); if (!old) fail('الفاتورة غير موجودة');
    if (old.voided) fail('لا يمكن تعديل فاتورة محذوفة');
    const negKey = (n) => n.itemId + '|' + n.invoice;
    const negBefore = new Set(computeInventory(st).negatives.map(negKey));
    const snapshot = JSON.stringify({ st_invoices: st.invoices, st_txns: st.txns, counters: st.counters, _seq: st._seq });
    try {
      const keepSeq = old.seq; const rev = (old.revision || 0) + 1;
      // احتفظ بنسخة قديمة مؤرشفة بمعرّف مختلف
      const archive = JSON.parse(JSON.stringify(old)); archive.id = id + '#r' + (old.revision || 0); archive.no = archive.id; archive.voided = true; archive.voidReason = 'نسخة قديمة قبل التعديل'; archive.archived = true;
      st.txns.forEach((t) => { if (t.invoiceId === id && !t.voided) { t.voided = true; t.voidReason = 'تعديل الفاتورة ' + id; } });
      st.invoices = st.invoices.filter((x) => x.id !== id);
      st.invoices.push(archive);
      const inv = createInvoice(st, { ...d, type: old.type }, { reuseId: id, revision: rev, keepSeq, silent: true });
      if (!st.settings.allowNegativeStock) {
        const bad = computeInventory(st).negatives.find((n) => !negBefore.has(negKey(n)));
        if (bad) { const it = st.items.find((x) => x.id === bad.itemId); fail('لا يمكن حفظ هذا التعديل، لأنه يجعل الكمية المتاحة من "' + (it ? it.name : '') + '" غير كافية لفاتورة أخرى (' + bad.invoice + '). عدّل تلك الفاتورة أولًا أو فعّل المخزون السالب من الإعدادات.'); }
      }
      log(st, 'تعديل فاتورة', id, 'نسخة ' + rev, { old: invBrief(old), new: invBrief(inv) });
      return inv;
    } catch (e) {
      const s = JSON.parse(snapshot); st.invoices = s.st_invoices; st.txns = s.st_txns; st.counters = s.counters; st._seq = s._seq;
      throw e;
    }
  }

  function addAdjustment(st, d) {
    const it = st.items.find((x) => x.id === d.itemId); if (!it) fail('الصنف غير موجود');
    const delta = qty3(d.delta); if (!delta) fail('أدخل الفرق في الكمية (موجب أو سالب)');
    if (!d.reason || !String(d.reason).trim()) fail('اكتب سبب التسوية (جرد، تلف، فقد...)');
    const adj = { id: 'ADJ-' + nextNo(st, 'ADJ', 4), date: d.date || today(), itemId: it.id, delta, reason: d.reason, voided: false, seq: seqOf(st) };
    if (delta < 0 && !st.settings.allowNegativeStock) {
      if (availableQty(st, it.id) + delta < -1e-9) fail('التسوية تجعل المخزون سالبًا');
    }
    st.adjustments.push(adj);
    log(st, 'تسوية مخزون', adj.id, it.name + ' ' + delta);
    return adj;
  }

  /* ---------- الأرصدة وكشوف الحساب ---------- */
  function partyStatement(st, partyId, from, to) {
    const party = st.parties.find((p) => p.id === partyId); if (!party) fail('الطرف غير موجود');
    const rows = [];
    st.invoices.forEach((inv) => {
      if (inv.voided || inv.partyId !== partyId) return;
      const sign = { sale: 1, purchase: -1, sale_return: -1, purchase_return: 1 }[inv.type];
      rows.push({ date: inv.date, seq: inv.seq, kind: INVOICE_TYPES[inv.type].label, ref: inv.no, amount: sign * inv.total, note: inv.note });
    });
    st.txns.forEach((t) => {
      if (t.voided || t.partyId !== partyId) return;
      const e = txnEffect(t);
      if (e.party) rows.push({ date: t.date, seq: t.seq, kind: TXN_LABELS[t.type], ref: t.no, amount: e.party, note: t.note || '' });
    });
    rows.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq));
    let bal = party.opening;
    const opening = party.opening;
    const out = [];
    let periodOpening = opening;
    rows.forEach((r) => {
      if (from && r.date < from) { periodOpening += r.amount; bal += r.amount; return; }
      if (to && r.date > to) return;
      bal += r.amount; out.push({ ...r, balance: bal });
    });
    return { party, opening: periodOpening, rows: out, closing: bal, text: describeBalance(bal) };
  }

  function partyBalance(st, partyId) {
    const s = partyStatement(st, partyId); return s.closing;
  }

  function describeBalance(bal) {
    if (bal > 0) return { dir: 'له عليه', label: 'مدين لي (مستحق لي عنده)', cls: 'pos' };
    if (bal < 0) return { dir: 'عليّ له', label: 'دائن (مستحق عليّ له)', cls: 'neg' };
    return { dir: 'متزن', label: 'الحساب متزن', cls: 'zero' };
  }

  function partnerStatement(st, from, to, partnerId) {
    const rows = [];
    st.txns.forEach((t) => {
      if (t.voided) return;
      if (partnerId && !(isPartnerTxn(t) && partnerOf(st, t) === partnerId)) return;
      const e = txnEffect(t);
      const relevant = e.partner || e.profitReceived || e.profitApproved || e.paidToPartnerProfit || ['give_partner', 'recv_partner', 'partner_adjust', 'profit_approve'].includes(t.type) || (t.type === 'expense' && t.partnerEffectAmount);
      if (!relevant) return;
      let label = TXN_LABELS[t.type];
      if (t.nature && PARTNER_NATURE.give[t.nature] && t.type === 'give_partner') label += ' - ' + PARTNER_NATURE.give[t.nature].label;
      if (t.nature && PARTNER_NATURE.recv[t.nature] && t.type === 'recv_partner') label += ' - ' + PARTNER_NATURE.recv[t.nature].label;
      if (t.type === 'expense') label = (t.paidBy === 'me' ? 'مصروف دفعته أنا' : 'مصروف دفعه شريكي') + ' (' + t.category + ')' + (t.scope === 'partner' ? ' - يخصه' : ' - يخص التجارة');
      rows.push({ id: t.id, type: t.type, date: t.date, seq: t.seq, ref: t.no, label, amount: t.amount, balanceEffect: e.partner, profitReceived: e.profitReceived, profitApproved: e.profitApproved, paidToPartnerProfit: e.paidToPartnerProfit, note: t.note || '' });
    });
    rows.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq));
    let bal = 0, opening = 0;
    const out = [];
    rows.forEach((r) => {
      if (from && r.date < from) { opening += r.balanceEffect; bal += r.balanceEffect; return; }
      if (to && r.date > to) return;
      bal += r.balanceEffect; out.push({ ...r, balance: bal });
    });
    return { opening, rows: out, closing: bal, text: bal > 0 ? { label: 'مستحق لي عند شريكي', cls: 'pos' } : bal < 0 ? { label: 'مستحق عليّ لشريكي', cls: 'neg' } : { label: 'متزن', cls: 'zero' } };
  }

  // إجماليات ما دفعه كل طرف وما استلمه (للفترة المختارة). ما دفعه شريكي = ما استلمته أنا، وما دفعته أنا = ما استلمه شريكي.
  function partnerTotals(st, from, to, partnerId) {
    const r = { gave: 0, got: 0, expForHim: 0, expForMe: 0, adjUp: 0, adjDown: 0, profitIn: 0, profitOut: 0 };
    st.txns.forEach((t) => {
      if (t.voided || (from && t.date < from) || (to && t.date > to)) return;
      if (partnerId && !(isPartnerTxn(t) && partnerOf(st, t) === partnerId)) return;
      if (t.type === 'give_partner') { r.gave += t.amount; if (t.nature === 'his_share') r.profitOut += t.amount; }
      else if (t.type === 'recv_partner') { r.got += t.amount; if (t.nature === 'profit') r.profitIn += t.amount; }
      else if (t.type === 'expense' && t.partnerEffectAmount) { if (t.paidBy === 'me') r.expForHim += t.partnerEffectAmount; else r.expForMe += t.partnerEffectAmount; }
      else if (t.type === 'partner_adjust') { if (t.partnerEffectSign > 0) r.adjUp += t.amount; else r.adjDown += t.amount; }
    });
    r.paidByMe = r.gave + r.expForHim; r.paidByPartner = r.got + r.expForMe;
    r.receivedByPartner = r.paidByMe; r.receivedByMe = r.paidByPartner;
    return r;
  }

  /* ---------- الأرباح ---------- */
  function computeProfit(st, from, to) {
    const inRange = (d) => (!from || d >= from) && (!to || d <= to);
    const inv = computeInventory(st);
    let sales = 0, saleReturns = 0, cogsSales = 0, cogsReturns = 0, purchaseReturnDiff = 0, purchases = 0, purchaseReturns = 0;
    let missingCost = false;
    st.invoices.forEach((i) => {
      if (i.voided || !inRange(i.date)) return;
      if (i.type === 'sale') { sales += i.total; cogsSales += inv.cogs[i.id] || 0; if (!(inv.cogs[i.id] > 0) && i.total > 0) missingCost = true; }
      else if (i.type === 'sale_return') { saleReturns += i.total; cogsReturns += inv.cogs[i.id] || 0; }
      else if (i.type === 'purchase') purchases += i.total;
      else if (i.type === 'purchase_return') { purchaseReturns += i.total; purchaseReturnDiff += inv.retDiff[i.id] || 0; }
    });
    let expenses = 0;
    st.txns.forEach((t) => { if (!t.voided && t.type === 'expense' && t.scope === 'trade' && inRange(t.date)) expenses += t.amount; });
    let adjust = 0;
    st.adjustments.forEach((a) => { if (!a.voided && inRange(a.date)) adjust += inv.adjValue[a.id] || 0; });
    const netSales = sales - saleReturns;
    const cogs = cogsSales - cogsReturns;
    const gross = netSales - cogs;
    const net = gross + purchaseReturnDiff + adjust - expenses;
    const warnings = [];
    if (missingCost) warnings.push('بعض المبيعات بتكلفة صفر (صنف بلا تكلفة شراء). الربح قد يكون أكبر من الحقيقي. سجّل تكلفة الأصناف أو فواتير الشراء.');
    if (inv.negatives.length) warnings.push('يوجد مخزون سالب مؤقت في بعض الأصناف، لذلك تكلفة البضاعة المباعة تقديرية.');
    if (!st.invoices.some((i) => !i.voided && i.type === 'sale' && inRange(i.date))) warnings.push('لا توجد مبيعات في هذه الفترة.');
    const shares = profitShares(st, net); const ownRow = shares.rows.find((r) => r.partner.owner);
    const myShareAmt = shares.source === 'capital' ? ownRow.share : Math.round(net * (st.settings.myShare / 100));
    // الاعتماد والاستلام (كل الفترات، لأنها حقوق تراكمية)
    let approved = 0, received = 0, receivedFromPartner = 0, receivedFromTrade = 0, paidToPartnerProfit = 0;
    st.txns.forEach((t) => {
      if (t.voided) return; const e = txnEffect(t);
      approved += e.profitApproved; received += e.profitReceived; paidToPartnerProfit += e.paidToPartnerProfit;
      if (t.type === 'recv_partner') receivedFromPartner += e.profitReceived;
      if (t.type === 'withdraw') receivedFromTrade += e.profitReceived;
    });
    return {
      sales, saleReturns, netSales, cogs, gross, expenses, adjust, purchaseReturnDiff, net, purchases, purchaseReturns,
      myShareAmt, share: shares.source === 'capital' ? Math.round(ownRow.pct * 100) / 100 : st.settings.myShare, shares, approved, received, receivedFromPartner, receivedFromTrade, paidToPartnerProfit,
      dueApproved: approved - received, notYetApproved: myShareAmt - approved,
      complete: warnings.filter((w) => !w.startsWith('لا توجد')).length === 0, warnings,
    };
  }

  /* ---------- سلفتي للنشاط ---------- */
  // السلفة = حركات «أضفت من مالي للتجارة» بطبيعة loan (إقراض)، و«سحب من التجارة» بطبيعة loan (استرداد). تُحسب دائمًا من السجل.
  // هي دين لي على النشاط: لا إيراد ولا ربح ولا رأس مال، ولا تدخل في أي معادلة ربح أو مخزون.
  function loanSummary(st, from, to) {
    const list = st.txns.filter((t) => !t.voided && t.nature === 'loan' && (t.type === 'contribute' || t.type === 'withdraw'));
    list.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq));
    let bal = 0, lent = 0, repaid = 0, lentP = 0, repaidP = 0;

  function cleanName(v) { return String(v == null ? '' : v).replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40); }

  // الاستعادة: تعيد السجل نفسه بنفس معرّفه (لا نسخة جديدة) وكل الأرصدة تُحسب من السجل بنفس المنطق الحالي

  /* ---------- قالب الفاتورة وملفات PDF ----------

  const cleanText = (v, max, multi) => String(v == null ? '' : v).replace(multi ? /[\u0000-\u0009\u000b-\u001f\u007f]/g : /[\u0000-\u001f\u007f]/g, '').slice(0, max);

const LS_KEY = 'alamer_state_v1';
const THEME_KEY = 'alamer_theme';
function getTheme() { try { const v = localStorage.getItem(THEME_KEY); return v === 'light' || v === 'dark' ? v : 'auto'; } catch (e) { return 'auto'; } }
function effectiveDark() { const t = getTheme(); if (t !== 'auto') return t === 'dark'; try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; } }
function applyTheme() { const t = getTheme(); const el = document.documentElement; if (t === 'auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', t); }
function setTheme(m) { try { if (m === 'auto') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, m); } catch (e) {} applyTheme(); }
applyTheme();
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = (n) => String(n).padStart(2, '0');
const localToday = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const monthStart = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-01'; };
const fmtN = (q) => (Math.abs(q) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const M = (q) => '<span class="m">' + (q < 0 ? '−' : '') + fmtN(q) + ' ج.م</span>';
const Mt = (q) => (q < 0 ? '−' : '') + fmtN(q) + ' ج.م';
const num = (s) => {
  if (s == null) return 0;
  let t = String(s).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g, '.').replace(/[,،٬\s]/g, '');
  const v = parseFloat(t); return isFinite(v) ? v : 0;
};

let S = A.emptyState();

let saveInfo = 'جاري التحميل';
let dbCol = null, lastSaved = {}, saving = false, dirty = false, uidReady = false, savedAt = 0;
let cloudChecked = false, persisted = null, installEvt = null;

function hydrate(state) { return A.parseBackup(JSON.stringify({ app: 'alamer-accounts', state })); }
function lsRead() { try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify({ savedAt, state: S })); } catch (e) {} }
const safeKey = (s) => String(s).replace(/[^A-Za-z0-9_-]/g, '_');

function buildDocs() {
  const docs = {};
  docs.meta = { t: 'meta', savedAt, d: { v: S.v, settings: S.settings, counters: S.counters, _seq: S._seq || 0 } };
  const chunk = (arr, size, pre) => { for (let i = 0; i < arr.length; i += size) docs[pre + '_' + pad2(Math.floor(i / size))] = { t: pre, d: arr.slice(i, i + size) }; };
  chunk(S.parties, 120, 'parties'); chunk(S.items, 120, 'items'); chunk(S.invoices, 40, 'invoices');
  chunk(S.txns, 120, 'txns'); chunk(S.adjustments, 120, 'adjustments'); chunk(S.audit, 150, 'audit'); chunk(S.recycle || [], 150, 'recycle');
  return docs;
}
async function flushDb() {
  if (!dbCol) return;
  if (saving) { dirty = true; return; }
  saving = true; dirty = false;
  try {
    const docs = buildDocs(); const next = {};
    for (const k of Object.keys(docs)) {

function readExps(form) { return [...form.querySelectorAll('.exr')].map((r) => ({ category: $('[name=xcat]', r).value === '__new' ? $('[name=xcatNew]', r).value.trim() : $('[name=xcat]', r).value, amount: A.toQ(num($('[name=xamt]', r).value)), paidBy: $('[name=xby]', r).value, note: $('[name=xnote]', r).value.trim() })).filter((x) => x.amount || x.note); }
function openInvoiceForm(type, existing, draft, pre) {
  const src = existing || draft || null;
  const base = type.replace('_return', ''); const isRet = type.endsWith('_return');
  const L = A.INVOICE_TYPES[type].label; const isSaleSide = base === 'sale';

  const parties = partyList();
  const partyOpts = [['', 'اختر ' + (isSaleSide ? 'العميل' : 'المورد')]].concat(parties.map((p) => [p.id, p.name])).concat([['__new', '+ طرف جديد']]);
  const lines = src && src.lines && src.lines.length ? src.lines : [null];
  const body = '<div class="fields">' + field('التاريخ', '<input type="date" name="date" value="' + (src ? src.date : localToday()) + '">') +

    '<div id="newParty" hidden class="two">' + field('اسم الطرف الجديد', inp('newName', '')) + field('الهاتف', inp('newPhone', '', 'inputmode="tel"')) + '</div>' +
    (!isSaleSide || isRet ? '' : '') + '<div id="lines" class="fields"></div><button type="button" class="btn alt" data-act="addLine">+ إضافة صنف</button>' +
    '<div class="card" id="expBox" style="margin:6px 0"><h2 style="font-size:16px">مصروفات الفاتورة</h2><div class="hint" style="margin-bottom:6px">نقل، تحميل، شحن… تُسجَّل مع الفاتورة وتظهر تلقائيًا في قسم المصروفات مرتبطة بها. لا تغيّر إجمالي الفاتورة ولا المخزون ولا حساب الطرف.</div><div id="exps" class="fields"></div><button type="button" class="btn alt" data-act="addExp">+ إضافة مصروف للفاتورة</button></div>' +
    '<div class="two">' + field('خصم على الفاتورة', money('discount', src && src.discount ? src.discount / 100 : '')) + field('الإجمالي', '<input id="tot" readonly value="0.00">') + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)"><span>طريقة الدفع</span><div class="chips" id="modeChips" role="group" aria-label="طريقة الدفع">' + [['cash', 'كاش'], ['credit', 'آجل'], ['partial', 'دفع جزئي']].map((m) => '<button type="button" class="chip' + (m[0] === curMode ? ' on' : '') + '" data-mode="' + m[0] + '">' + m[1] + '</button>').join('') + '</div><input type="hidden" name="payMode" value="' + curMode + '"></div><div id="modeHint" class="hint"></div>' +
    '<div id="paidBox">' + field(isRet ? 'المبلغ المسترد فعلًا' : (isSaleSide ? 'المبلغ الذي دفعه العميل فعلًا' : 'المبلغ الذي دفعته فعلًا'), money('paid', src && curMode === 'partial' && src.paid ? src.paid / 100 : '')) + '</div>' +
    field('المتبقي', '<input id="rem" readonly value="0.00">') +
    '<div class="two" id="payWhere">' + field('وسيلة الدفع', sel('method', PAY_METHODS, src ? src.method : 'cash')) + field(isSaleSide ? 'تدخل في' : 'تخرج من', '<select name="acc">' + accOpts(src ? src.acc : 'trade') + '</select>') + '</div>' +
    field('ملاحظات', '<textarea name="note">' + esc(src ? src.note : '') + '</textarea>') +
    '</div>';
  openSheet((existing ? 'تعديل ' : '') + L + (existing ? ' ' + existing.no : ''), body, {
    submit: existing ? 'حفظ التعديل' : 'اعتماد الفاتورة', noFocus: true,
    mount(form) {
      const linesEl = $('#lines', form);
      const addLine = (ln) => { const w = document.createElement('div'); w.innerHTML = lineRowHtml(base, ln); const el = w.firstChild; linesEl.appendChild(el); enhancePickers(el); recalc(); return el; };
      lines.forEach((l) => addLine(l));
      const expsEl = $('#exps', form);
      const addExp = (x) => { const w = document.createElement('div'); w.innerHTML = expRowHtml(x); expsEl.appendChild(w.firstChild); };
      ((src && src.expenses) || []).forEach((x) => addExp(x));
      function recalc() {
        let sub = 0;
        linesEl.querySelectorAll('.ln').forEach((r) => {
          const q = num($('.qty', r).value), u = num($('.unit', r).value), dsc = num($('.dis', r).value);
          const g = Math.round(q * A.toQ(u)); const net = g - A.toQ(dsc); sub += Math.max(0, net);
          $('.lt', r).textContent = fmtN(Math.max(0, net));
          const it = S.items.find((x) => x.id === $('.it', r).value); const av = $('.avail', r);
          if (it && (isSaleSide && !isRet || (!isSaleSide && isRet))) { const have = A.computeInventory(S).per[it.id].qty; av.textContent = 'المتاح: ' + have + ' ' + it.unit; av.style.color = q > have ? 'var(--neg)' : ''; } else av.textContent = it ? it.unit : '';
        });
        const tot = Math.max(0, sub - A.toQ(num(form.elements.discount.value)));
        const mode = form.elements.payMode.value;

        $('#tot', form).value = fmtN(tot); $('#rem', form).value = fmtN(Math.max(0, tot - pd));
        $('#paidBox', form).hidden = mode !== 'partial'; $('#payWhere', form).hidden = mode === 'credit';
        $('#modeHint', form).textContent = mode === 'cash' ? 'تُعتبر الفاتورة مدفوعة بالكامل (' + fmtN(tot) + ' ج.م) وتُسجَّل في الخزنة تلقائيًا. المتبقي صفر.' : mode === 'credit' ? 'لا يُسجَّل أي مبلغ في الخزنة. تُسجَّل قيمة الفاتورة كاملة على حساب الطرف.' : 'اكتب المبلغ المدفوع فعلًا فقط. المتبقي يُحسب تلقائيًا ويُسجَّل في حساب الطرف.';
      }
      form.addEventListener('input', recalc);
      form.addEventListener('change', (e) => {
        if (e.target.classList.contains('it')) {
          const r = e.target.closest('.ln'); const nw = $('.nw', r); nw.hidden = e.target.value !== '__new';
          const it = S.items.find((x) => x.id === e.target.value);
          if (it && !num($('.unit', r).value)) $('.unit', r).value = (base === 'sale' ? it.price : it.cost) / 100 || '';
        }
        if (e.target.name === 'partyId') $('#newParty', form).hidden = e.target.value !== '__new';
        recalc();
      });
      form.addEventListener('click', (e) => {
        const mc = e.target.closest('[data-mode]');
        if (mc) { form.elements.payMode.value = mc.dataset.mode; form.querySelectorAll('[data-mode]').forEach((x) => x.classList.toggle('on', x === mc)); recalc(); return; }
        const a = e.target.closest('[data-act]'); if (!a) return;
        if (a.dataset.act === 'addExp') { addExp(null); e.stopPropagation(); }
        if (a.dataset.act === 'rmExp') { a.closest('.exr').remove(); e.stopPropagation(); form.dispatchEvent(new Event('change')); }
        if (a.dataset.act === 'addLine') { addLine(null); e.stopPropagation(); }
        if (a.dataset.act === 'rmLine') { if (linesEl.children.length > 1) a.closest('.ln').remove(); recalc(); e.stopPropagation(); }
      });
      recalc();
      if (draft) { if (draft.partyId === '__new') { $('#newParty', form).hidden = false; form.elements.newName.value = draft.newName || ''; form.elements.newPhone.value = draft.newPhone || ''; } }
      // مسودة تلقائية: لا تضيع الفاتورة غير المحفوظة لو أُغلقت النافذة أو أُعيد فتح البرنامج
      if (!existing) {
        const save = () => {
          if (!form.isConnected) return;
          const lns = [...form.querySelectorAll('.ln')].map((r) => ({ itemId: $('.it', r).value, qty: $('.qty', r).value, unit: A.toQ(num($('.unit', r).value)), discount: A.toQ(num($('.dis', r).value)) }));
          const meaningful = lns.some((l) => l.itemId || num(l.qty) || l.unit) || form.elements.partyId.value;
          if (!meaningful) { draftSet(null); return; }
          draftSet({ type, savedAt: Date.now(), date: form.elements.date.value, partyId: form.elements.partyId.value, newName: form.elements.newName.value, newPhone: form.elements.newPhone.value, lines: lns, expenses: readExps(form), discount: A.toQ(num(form.elements.discount.value)), paid: A.toQ(num(form.elements.paid.value)), payMode: form.elements.payMode.value, method: form.elements.method.value, acc: form.elements.acc.value, note: form.elements.note.value });
        };
        form.addEventListener('input', save); form.addEventListener('change', save); form.addEventListener('click', () => setTimeout(save, 0));
      }
    },
    onSubmit(fd, form) {
      const lns = [...form.querySelectorAll('.ln')].map((r) => ({ itemId: $('.it', r).value, nw: $('.nw', r).value.trim(), qty: num($('.qty', r).value), unit: num($('.unit', r).value), discount: num($('.dis', r).value) })).filter((l) => l.itemId || l.qty || l.unit);
      let partyId = fd.get('partyId');
      const res = commit(() => {
        if (partyId === '__new') partyId = A.addParty(S, { name: fd.get('newName'), phone: fd.get('newPhone') }).id;
        lns.forEach((l) => { if (l.itemId === '__new') { if (!l.nw) A.addItem(S, { name: '' }); const it = A.addItem(S, { name: l.nw, cost: l.unit, price: l.unit }); l.itemId = it.id; } else if (!l.itemId) { const e = new Error('اختر الصنف لكل سطر أو احذف السطر الفارغ'); e.userMessage = e.message; throw e; } });
        const data = { type, date: fd.get('date'), partyId, lines: lns, discount: num(fd.get('discount')), paid: num(fd.get('paid')), payMode: fd.get('payMode'), method: fd.get('method'), acc: fd.get('acc'), note: fd.get('note'), expenses: readExps(form).map((x) => ({ ...x, amount: x.amount / 100 })) };
        data.expenses.forEach((x) => { if (x.category) x.category = A.ensureListName(S, 'expenseCats', x.category); });
        return existing ? A.editInvoice(S, existing.id, data) : A.createInvoice(S, data);
      }, existing ? 'تم حفظ التعديل' : 'تم اعتماد الفاتورة');
      if (res.ok && !existing) draftSet(null);
      return res.ok;
    },
  });
}

function txnSource(t) {
  const inv = t.invoiceId && S.invoices.find((i) => i.id === t.invoiceId);
  if (t.auto && inv) return 'من ' + A.INVOICE_TYPES[inv.type].label + ' ' + inv.no;
  if (t.type === 'opening') return 'رصيد افتتاحي';
  if (['give_partner', 'recv_partner', 'partner_adjust'].includes(t.type) || (t.type === 'expense' && t.partnerEffectAmount)) return 'حسابات الشريك';
  if (t.type === 'expense') return 'مصروف: ' + (t.category || '');

/* ---- نسخ داخل التطبيق (IndexedDB) ---- */
let bkIdb = null;
function idbOpen() { return new Promise((res, rej) => { try { const r = indexedDB.open('alamer-bk', 1); r.onupgradeneeded = () => { r.result.createObjectStore('copies', { keyPath: 'id' }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error || new Error('idb')); r.onblocked = () => rej(new Error('blocked')); } catch (e) { rej(e); } }); }
async function idbRun(mode, fn) {
  const db = bkIdb || (bkIdb = await idbOpen());
  return new Promise((res, rej) => { const tx = db.transaction('copies', mode); const out = fn(tx.objectStore('copies')); tx.oncomplete = () => res(out ? out.result : undefined); tx.onerror = () => rej(tx.error || new Error('tx')); tx.onabort = () => rej(tx.error || new Error('abort')); });
}
async function copyPut(rec) { await idbRun('readwrite', (st) => st.put(rec)); }
async function copyAll() { const l = (await idbRun('readonly', (st) => st.getAll())) || []; return l.sort((a, b) => (a.at < b.at ? 1 : -1)); }
async function copyDel(id) { await idbRun('readwrite', (st) => st.delete(id)); }
async function copyPrune() { try { const l = await copyAll(); const keep = { auto: 10, prerestore: 5 }; const seen = {}; for (const c of l) { seen[c.kind] = (seen[c.kind] || 0) + 1; if (keep[c.kind] && seen[c.kind] > keep[c.kind]) await copyDel(c.id); } } catch (e) {} }
async function copySave(kind, name, text, id) {
  await copyPut({ id: id || (kind + '-' + Date.now()), kind, name, at: new Date().toISOString(), bytes: text.length, counts: bkCounts(JSON.parse(text).state), text });
  copyPrune();
}

/* ---- Google Drive ---- */
class BkErr extends Error { constructor(code, msg) { super(msg); this.code = code; this.userMessage = msg; } }
function gisLoad() {
  return new Promise((res, rej) => {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return res();
    if (navigator.onLine === false) return rej(new BkErr('offline', 'لا يوجد إنترنت'));
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    const t = setTimeout(() => rej(new BkErr('offline', 'تعذر الوصول إلى Google (تحقق من الإنترنت)')), 15000);
    s.onload = () => { clearTimeout(t); window.google && window.google.accounts ? res() : rej(new BkErr('offline', 'تعذر تحميل خدمة Google')); };
    s.onerror = () => { clearTimeout(t); rej(new BkErr('offline', 'تعذر الوصول إلى Google (تحقق من الإنترنت)')); };
    document.head.appendChild(s);
  });
}
async function gToken(interactive) {
  const m = bkMeta(); const cid = gClientId(); if (!cid) throw new BkErr('config', 'ربط Google Drive غير مفعّل بعد في هذه النسخة');
  { const pr = gClientProblem(cid); if (pr) throw new BkErr('config', pr); }
  if (gTok && gTok.exp > Date.now() + 60000) return gTok.token;
  await gisLoad();
  return new Promise((res, rej) => {
    let done = false; const fin = (f, v) => { if (!done) { done = true; clearTimeout(tm); f(v); } };
    const tm = setTimeout(() => fin(rej, new BkErr('auth', 'انتهت جلسة Google. اربط الحساب مرة أخرى')), interactive ? 120000 : 20000);
    try {
      const c = window.google.accounts.oauth2.initTokenClient({
        client_id: cid, scope: BK_SCOPE, hint: m.drive.email || undefined,
        callback: (r) => { if (r && r.access_token) { gTok = { token: r.access_token, exp: Date.now() + (Number(r.expires_in) || 3600) * 1000 }; fin(res, gTok.token); } else fin(rej, new BkErr('auth', r && r.error === 'access_denied' ? 'لم تتم الموافقة على الوصول. اضغط «ربط» ووافق على صلاحية Drive، وتأكد أن بريدك مضاف في Test users.' : 'انتهت جلسة Google. اربط الحساب مرة أخرى')); },
        error_callback: (e) => fin(rej, new BkErr('auth', e && e.type === 'popup_closed' ? 'أُغلقت نافذة Google قبل إتمام الموافقة. إن ظهر لك خطأ داخل النافذة فراجع «تشخيص مشاكل الربط» أدناه.' : e && e.type === 'popup_failed_to_open' ? 'منع المتصفح فتح نافذة Google. اسمح بالنوافذ المنبثقة لهذا الموقع ثم أعد المحاولة.' : 'تعذر تسجيل الدخول إلى Google. راجع «تشخيص مشاكل الربط» أدناه.')),
      });
      c.requestAccessToken({ prompt: interactive ? 'consent' : '' });

}
async function gFetch(url, opts, interactive, retried) {
  const tok = await gToken(interactive);
  let r;
  try { r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + tok }, (opts && opts.headers) || {}) })); }
  catch (e) { throw new BkErr('offline', 'لا يوجد إنترنت أو تعذر الوصول إلى Google Drive'); }
  if (r.status === 401) { gTok = null; if (!retried) return gFetch(url, opts, interactive, true); throw new BkErr('auth', 'انتهت جلسة Google. اربط الحساب مرة أخرى'); }

}
async function gFolder(interactive) {

  }

  const f = await (await gFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=1', {}, interactive)).json();
  let id = f.files && f.files[0] && f.files[0].id;
  if (!id) { const c = await (await gFetch('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: BK_FOLDER, mimeType: 'application/vnd.google-apps.folder' }) }, interactive)).json(); id = c.id; }

// الرفع لا يستبدل ولا يكرر: إن وُجد ملف بنفس الاسم في المجلد يُعتبر مرفوعًا
async function gUpload(name, text, interactive) {
  const folder = await gFolder(interactive);
  const q = encodeURIComponent("name='" + name + "' and '" + folder + "' in parents and trashed=false");
  const ex = await (await gFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=1', {}, interactive)).json();
  if (ex.files && ex.files[0]) return { id: ex.files[0].id, existed: true };
  const B = 'alamerbk' + Date.now();
  const body = '--' + B + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name, parents: [folder], mimeType: 'application/json' }) + '\r\n--' + B + '\r\nContent-Type: application/json\r\n\r\n' + text + '\r\n--' + B + '--';
  const r = await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + B }, body }, interactive);
  const j = await r.json(); if (!j.id) throw new BkErr('api', 'لم تؤكد Google Drive حفظ الملف'); return { id: j.id, existed: false };
}
