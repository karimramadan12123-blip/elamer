<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1d1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حسابات العامر">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>العامر لاستيراد الإكسسوارات الحريمي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* تخطيط: شريط علوي ثابت + محتوى بطاقات رأسي + شريط سفلي للأقسام السريعة + شاشات منبثقة سفلية للنماذج */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --surface2:#e7edec; --ink:#14262a; --muted:#5a6d70; --line:#d3dddc;
  --accent:#0e6b66; --accent-ink:#ffffff; --plum:#8a3b62; --pos:#1b7a4a; --neg:#b3372f; --warn:#9a6a00; --warn-bg:#fbf1d6;
  --pos-bg:#e1f3e8; --neg-bg:#f8e3e1; --shadow:0 1px 2px rgba(20,38,42,.08),0 4px 14px rgba(20,38,42,.06);
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --surface:#172326; --surface2:#1f3033; --ink:#e6eeee; --muted:#93a8ab; --line:#2b4144;
  --accent:#3fb8b0; --accent-ink:#06201f; --plum:#d089ad; --pos:#5cc98f; --neg:#ff8a80; --warn:#f0c14b; --warn-bg:#35290a;
  --pos-bg:#12301f; --neg-bg:#3a1a18; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --surface:#172326; --surface2:#1f3033; --ink:#e6eeee; --muted:#93a8ab; --line:#2b4144;
  --accent:#3fb8b0; --accent-ink:#06201f; --plum:#d089ad; --pos:#5cc98f; --neg:#ff8a80; --warn:#f0c14b; --warn-bg:#35290a;
  --pos-bg:#12301f; --neg-bg:#3a1a18; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 84px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--accent);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
.num,.m{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-ink);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px}
.top h1{font:700 18px/1.2 var(--f-display);margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .st{font-size:11px;opacity:.9;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:99px;white-space:nowrap}
.ib{background:rgba(255,255,255,.16);border:0;color:inherit;width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;display:grid;place-items:center}
main{padding-block:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2{font:700 15px/1.3 var(--f-display);margin:0 0 10px;color:var(--accent);letter-spacing:.2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font:600 17px/1.35 var(--f-body);word-break:break-word}
.stat.big{grid-column:1/-1}
.pos{color:var(--pos)} .neg{color:var(--neg)} .zero{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-align:center}
.btn.alt{background:var(--surface2);color:var(--ink)} .btn.plum{background:var(--plum);color:#fff} .btn.danger{background:var(--neg-bg);color:var(--neg)} .btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:focus-visible,.ib:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.acts .btn{width:100%}
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0} .row .t{font-weight:600;overflow-wrap:anywhere} .row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .e{text-align:left;white-space:nowrap;font-weight:600}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-inline-start:6px;white-space:nowrap}
.pill.pos{background:var(--pos-bg);color:var(--pos)} .pill.neg{background:var(--neg-bg);color:var(--neg)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.info{background:var(--surface2);color:var(--muted);border-radius:12px;padding:10px 12px;font-size:13.5px}
.bal{border-radius:12px;padding:12px;text-align:center;font-weight:700}
.bal.pos{background:var(--pos-bg);color:var(--pos)} .bal.neg{background:var(--neg-bg);color:var(--neg)} .bal.zero{background:var(--surface2);color:var(--muted)}
.bal .n{font:700 24px/1.3 var(--f-display)}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);min-width:0}
.fields{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;white-space:nowrap;cursor:pointer;min-height:40px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-weight:600;position:sticky;top:0}
td.n,th.n{text-align:left}
tfoot td{font-weight:700;background:var(--surface2)}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.nav button{background:none;border:0;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:52px}
.nav button .i{font-size:20px;line-height:1} .nav button.on{color:var(--accent);font-weight:700;background:var(--surface2)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.menu button{background:var(--surface);border:0;border-radius:14px;padding:16px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:600;cursor:pointer;min-height:90px}
.menu .i{font-size:26px}
.scrim{position:fixed;inset:0;background:rgba(5,15,16,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;min-width:0;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h3{font:700 17px var(--f-display);margin:0;flex:1}
.sheet .body{overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet footer{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet footer .btn{flex:1}
.ln{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ln .tt{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.toast{position:fixed;inset:auto 16px calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;text-align:center;box-shadow:var(--shadow)}
.toast.err{background:var(--neg);color:#fff}
.sep{height:1px;background:var(--line);margin:4px 0}
.hint{font-size:12.5px;color:var(--muted)}
.row2{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)} .row2:last-child{border-bottom:0}
.row2 span:first-child{color:var(--muted)} .row2 b{font-weight:600}
#splash{position:fixed;inset:0;z-index:100;background:#070706;display:grid;place-items:center;transition:opacity .45s ease}
#splash img{width:min(80vw,440px);aspect-ratio:1;object-fit:contain;display:block;-webkit-mask-image:radial-gradient(circle closest-side,#000 90%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 90%,transparent 100%)}
#splash.out{opacity:0;pointer-events:none}
.top .lg{width:38px;height:38px;border-radius:50%;flex:none;background:#070706;object-fit:cover}
.brand{display:flex;justify-content:center;padding-block:6px}
.brand img{width:min(58vw,220px);aspect-ratio:1;border-radius:50%;object-fit:cover;background:#070706;box-shadow:var(--shadow)}
tr[data-act]:active td{background:var(--surface2)}
html,body{overscroll-behavior-y:contain}
.hero{background:linear-gradient(160deg,var(--accent),#0a4f4b);color:var(--accent-ink);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.hero small{display:block;opacity:.85;font-size:14px}
.hero .big{font:700 30px/1.25 var(--f-display);margin:2px 0 6px;word-break:break-word}
.hero .big.neg{color:#ffd0d0}
.hero .eq{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;opacity:.95}
.hero .eq b{font-weight:700}
.hero .why{font-size:12.5px;opacity:.8;margin-top:8px}
.pk{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.pk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk.ph span{color:var(--muted)} .pk i{font-style:normal;color:var(--muted)}
.pov{position:fixed;left:0;right:0;top:0;height:100%;z-index:55;background:var(--bg);display:flex;flex-direction:column;max-width:640px;margin-inline:auto}
.pov header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.pov header h3{font:700 17px var(--f-display);margin:0;flex:1}
.pov .srch{padding:10px 12px 4px}
.pov .pchips{padding:4px 12px}
.pov .pl{overflow-y:auto;flex:1;padding:4px 12px 24px;display:flex;flex-direction:column;gap:6px}
.pov .po{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:start;cursor:pointer;min-height:52px}
.pov .po.on{outline:2px solid var(--accent)} .pov .po.new{background:var(--surface2);color:var(--accent);font-weight:700}
.pov .po .t{font-weight:600} .pov .po .s{font-size:12.5px;color:var(--muted)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
#ptr{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translate(-50%,-60px);z-index:25;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none}
.draft{background:var(--warn-bg,#fff4d6);color:var(--warn,#7a5a00);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.draft .btn{min-height:38px;padding:6px 12px}
.tbl.st td:nth-child(2){white-space:normal;min-width:84px}
.tbl.st table{font-size:13px}
.tbl.st th,.tbl.st td{padding:8px 5px}
.tbl.st td:nth-child(1){font-size:12px}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
@media (prefers-reduced-motion:no-preference){.scrim{animation:fi .15s ease-out}.sheet{animation:up .2s ease-out}@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(30px)}}}
/* ===== v8: هوية بصرية موحدة (ذهبي من الشعار + أخضر هادئ) ===== */
:root{--gold:#b8913a;--gold2:#ecd79a;--bar:#0b1d1e;--surface3:#f8faf9}
body::before{background:var(--bar)}
.top{background:var(--bar);color:var(--gold2);border-bottom:1px solid rgba(184,145,58,.5);gap:8px}
.top h1{color:var(--gold2);font-size:17px}
.top .lg{box-shadow:0 0 0 1.5px var(--gold);width:36px;height:36px}
.top .ib{width:40px;height:40px;font-size:18px;border-radius:12px;background:rgba(236,215,154,.12);color:var(--gold2)}
.top .st{background:rgba(236,215,154,.14);color:var(--gold2);max-width:38vw;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center}
.top .st::before,.dot{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5cc98f;margin-inline-end:6px;flex:none}
body.off .top .st::before,body.off .dot{background:#ff8a80}
body.off .top .st::after{content:" · بدون إنترنت";white-space:nowrap}
.ib,.btn,.chip,.row,.pk,.menu button,.nav button,.tile{transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease}
.ib:active,.btn:active,.chip:active,.menu button:active,.nav button:active,.tile:active{transform:scale(.97)}
main{gap:16px;padding-block:16px}
.card{border-radius:18px;padding:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.card h2{font-size:15.5px;margin-bottom:12px}
.btn{border-radius:14px;min-height:50px;font-size:15.5px}
.btn.plum{background:var(--plum)}
.btn.gold{background:linear-gradient(180deg,#d9b963,#b8913a);color:#241a02}
input,select,textarea,.pk{border-radius:14px;border-width:1.5px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip{min-height:42px;font-weight:500}
.nav{border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.nav button.on{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.sheet{border-radius:24px 24px 0 0;border-top:2px solid var(--gold)}
.sheet header h3,.pov header h3{color:var(--accent)}
.hero{background:linear-gradient(155deg,#0f726c 0%,#093f3b 70%);border:1px solid rgba(236,215,154,.5);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:-40% auto auto -20%;width:70%;aspect-ratio:1;background:radial-gradient(circle,rgba(236,215,154,.22),transparent 65%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .big{font-size:36px;color:#fff}
.hero small{color:var(--gold2);opacity:1;font-weight:500}
.home-brand{display:flex;align-items:center;gap:12px}
.home-brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#070706;box-shadow:0 0 0 2px var(--gold);flex:none}
.home-brand .hb{flex:1;min-width:0;display:flex;flex-direction:column}
.home-brand .hb b{font:700 17px/1.3 var(--f-display);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-brand .hb .conn{font-size:12.5px;color:var(--muted);display:flex;align-items:center}
.home-brand .ib{background:var(--surface2);color:var(--ink);width:44px;height:44px;border:1px solid var(--line);border-radius:14px;cursor:pointer;display:grid;place-items:center;font-size:19px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;min-width:0;box-shadow:var(--shadow)}
.tile small{display:block;color:var(--muted);font-size:12.5px}
.tile b{display:block;font:700 16px/1.4 var(--f-body);margin-top:2px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa .btn{flex-direction:column;gap:2px;min-height:68px;font-size:15px}
.qa .btn .qi{font-size:22px;line-height:1}
.rec .row{padding:11px 2px}
.rec .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);font-size:18px;flex:none}
.rec .ic.in{background:var(--pos-bg)} .rec .ic.out{background:var(--neg-bg)}
.sect{display:flex;align-items:center;justify-content:space-between;margin:0 2px -4px}
.sect h2{font:700 15.5px var(--f-display);color:var(--accent);margin:0}
.sect a{font-size:13.5px;color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}
.rg .row{padding:13px 2px}
.rg .gi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--surface2);flex:none}
.gh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.gh b{font:700 16px var(--f-display);display:block} .gh span{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;direction:ltr}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.toast{background:var(--bar);color:#fff;border-inline-start:5px solid var(--pos);text-align:start;display:flex;gap:8px;align-items:center}
.toast.err{background:var(--bar);border-inline-start-color:var(--neg);color:#ffd7d3}
.toast.info{border-inline-start-color:var(--gold)}
/* شاشة البداية */
#splash{background:#070706}
#splash .sp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 24px;text-align:center}
#splash .sp-logo{position:relative;width:min(62vw,290px)}
#splash .sp-logo::before{content:"";position:absolute;inset:-14%;background:radial-gradient(circle,rgba(212,175,90,.42),transparent 62%);opacity:0;animation:spGlow 1.4s ease-out .1s both}
#splash img{position:relative;width:100%}
#splash .sp-name{font:700 30px/1.3 var(--f-display);color:var(--gold2);opacity:0;animation:spUp .55s ease-out .3s both}
#splash .sp-sub{font-size:14.5px;color:#b9a66f;opacity:0;animation:spUp .55s ease-out .45s both}
#splash .sp-bar{width:120px;height:3px;border-radius:3px;background:rgba(236,215,154,.16);overflow:hidden;margin-top:16px;opacity:0;animation:spUp .4s ease-out .5s both}
#splash .sp-bar i{display:block;height:100%;width:40%;border-radius:3px;background:#d4af5a;animation:spBar 1s ease-in-out infinite alternate}
#splash .sp{animation:spIn .6s ease-out both}
#splash.out .sp{transform:scale(1.04);transition:transform .45s ease}
@keyframes spIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spGlow{0%{opacity:0;transform:scale(.8)}60%{opacity:1}100%{opacity:.7;transform:scale(1)}}
@keyframes spBar{from{transform:translateX(-120%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#splash .sp,#splash .sp-name,#splash .sp-sub,#splash .sp-bar,#splash .sp-logo::before,#splash .sp-bar i{animation:none;opacity:1}}

.eq3{display:flex;gap:8px;margin-top:6px}
.eq3 span{flex:1;min-width:0;background:rgba(255,255,255,.1);border-radius:12px;padding:7px 8px;font-size:12px;color:var(--gold2);display:flex;flex-direction:column;align-items:center}
.eq3 b{color:#fff;font:700 14px/1.4 var(--f-body);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.home-brand .hb b{white-space:normal;font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips.wrap .chip,.pbar .chip{flex:none}
@media (max-width:360px){.top .st{font-size:0;padding:6px 8px;gap:0}.top .st::before{margin:0}.top h1{font-size:16px}.hero .big{font-size:31px}}
</style>

<div id="root"></div>

<script>
/* ============================================================
   العامر - المحرك المحاسبي (بدون واجهة، قابل للاختبار)
   كل المبالغ أعداد صحيحة بالقرش (1 جنيه = 100 قرش) لتجنب أخطاء التقريب.
   كل الأرصدة والمخزون والأرباح تُحسب من السجلات (لا تُخزَّن)،
   لذلك إعادة فتح أي فاتورة لا تكرر أثرها أبدًا.
   ============================================================ */
(function (root) {
  'use strict';

  const toQ = (pounds) => Math.round((Number(pounds) || 0) * 100 + (pounds < 0 ? -1e-9 : 1e-9));
  const toP = (q) => (q || 0) / 100;
  const qty3 = (n) => Math.round((Number(n) || 0) * 1000) / 1000;

  const ACCOUNTS = { trade: 'نقدية معي (خزنة الشغل)', bank: 'رصيد في البنك', wallet: 'محفظة / حساب آخر', personal: 'أموالي الشخصية' };
  const WORK_ACCS = ['trade', 'bank', 'wallet'];
  const INVOICE_TYPES = {
    sale: { label: 'فاتورة بيع', prefix: 'S' },
    purchase: { label: 'فاتورة شراء', prefix: 'P' },
    sale_return: { label: 'مرتجع مبيعات', prefix: 'SR' },
    purchase_return: { label: 'مرتجع مشتريات', prefix: 'PR' },
  };
  const EXPENSE_CATS = ['النقل', 'الشحن', 'التخزين', 'العمالة', 'الإيجار', 'التعبئة والتغليف', 'مصروفات بنكية', 'أخرى'];

  function emptyState() {
    return {
      v: 1,
      settings: {
        shopName: 'العامر لاستيراد الإكسسوارات الحريمي',
        startDate: '',
        dupIgnored: [],
        categories: [], // فئات الأصناف (أسماء)
        myShare: 50, // نسبة نصيبي من الأرباح %
        allowNegativeStock: false,
        openingCash: { trade: 0, personal: 0 },
      },
      counters: { S: 0, P: 0, SR: 0, PR: 0, T: 0, PTY: 0, ITM: 0, ADJ: 0 },
      parties: [],
      items: [],
      invoices: [],
      txns: [],
      adjustments: [],
      audit: [],
    };
  }

  const today = () => new Date().toISOString().slice(0, 10);
  const pad = (n, w) => String(n).padStart(w, '0');
  function nextNo(st, key, width) { st.counters[key] = (st.counters[key] || 0) + 1; return pad(st.counters[key], width); }
  function log(st, action, ref, detail) {
    st.audit.push({ at: new Date().toISOString(), action, ref, detail: detail || '' });
  }
  function fail(msg) { const e = new Error(msg); e.userMessage = msg; throw e; }

  /* ---------- الأطراف ---------- */
  function addParty(st, p) {
    if (!p.name || !String(p.name).trim()) fail('اسم الطرف مطلوب');
    const dup = st.parties.find((x) => !x.deleted && x.name.trim() === String(p.name).trim());
    if (dup) fail('يوجد طرف بنفس الاسم. استخدم الحساب الموجود بدل إنشاء حساب ثانٍ.');
    const id = 'PTY-' + nextNo(st, 'PTY', 4);
    const party = {
      id, name: String(p.name).trim(), phone: p.phone || '', address: p.address || '', notes: p.notes || '',
      kind: 'both', // كل الأطراف حساب واحد موحد: عميل ومورد معًا
      opening: toQ(p.opening || 0), // موجب = مدين لي (عليه لي)، سالب = دائن (عليّ له)
      createdAt: new Date().toISOString(),
    };
    st.parties.push(party);
    log(st, 'إضافة طرف', id, party.name);
    return party;
  }
  function updateParty(st, id, patch) {
    const p = st.parties.find((x) => x.id === id); if (!p) fail('الطرف غير موجود');
    if (patch.name != null) {
      const n = String(patch.name).trim(); if (!n) fail('اسم الطرف مطلوب');
      const dup = st.parties.find((x) => x.id !== id && !x.deleted && x.name.trim() === n);
      if (dup) fail('يوجد طرف آخر بنفس الاسم');
      p.name = n;
    }
    ['phone', 'address', 'notes'].forEach((k) => { if (patch[k] != null) p[k] = patch[k]; });
    if (patch.opening != null) p.opening = toQ(patch.opening);
    log(st, 'تعديل طرف', id, p.name);
    return p;
  }

  /* ---------- حذف ودمج الأطراف ---------- */
  function normName(s) { return String(s || '').replace(/[ً-ٰٟـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function normPhone(s) { const d = String(s || '').replace(/[٠-٩]/g, (c) => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g, ''); return d.length >= 9 ? d.slice(-9) : ''; }
  function partyUsage(st, id) {
    const p = st.parties.find((x) => x.id === id); if (!p) fail('الطرف غير موجود');
    const invoices = st.invoices.filter((i) => i.partyId === id && !i.voided && !i.archived).length;
    const txns = st.txns.filter((t) => t.partyId === id && !t.voided).length;
    return { invoices, txns, opening: p.opening, used: invoices > 0 || txns > 0 || p.opening !== 0 };
  }
  // الحذف الآمن: لا يُحذف طرف له فواتير أو حركات أو رصيد، حتى لا تضيع حسابات
  function deleteParty(st, id) {
    const p = st.parties.find((x) => x.id === id); if (!p || p.deleted) fail('الطرف غير موجود');
    const u = partyUsage(st, id);
    if (u.used) fail('لا يمكن حذف «' + p.name + '» لأن له ' + u.invoices + ' فاتورة و' + u.txns + ' حركة' + (u.opening ? ' ورصيدًا افتتاحيًا' : '') + '. احذف فواتيره وحركاته أولًا، أو ادمجه مع طرف آخر إن كان مكررًا.');
    p.deleted = true; p.deletedAt = new Date().toISOString();
    log(st, 'حذف طرف', id, p.name);
    return p;
  }
  // الدمج: ينقل كل فواتير وحركات ورصيد طرف إلى طرف آخر، والمجموع قبل الدمج = المجموع بعده تمامًا
  function mergeParties(st, keepId, dropId) {
    if (keepId === dropId) fail('اختر طرفين مختلفين');
    const keep = st.parties.find((x) => x.id === keepId && !x.deleted), drop = st.parties.find((x) => x.id === dropId && !x.deleted);
    if (!keep || !drop) fail('الطرف غير موجود');
    const before = partyBalance(st, keepId) + partyBalance(st, dropId);
    const snap = JSON.stringify({ p: st.parties, i: st.invoices, t: st.txns });
    st.invoices.forEach((i) => { if (i.partyId === dropId) i.partyId = keepId; });
    st.txns.forEach((t) => { if (t.partyId === dropId) t.partyId = keepId; });
    keep.opening += drop.opening;
    if (!keep.phone && drop.phone) keep.phone = drop.phone;
    if (!keep.address && drop.address) keep.address = drop.address;
    keep.notes = (keep.notes ? keep.notes + '\n' : '') + 'مدمج من: ' + drop.name + (drop.phone ? ' (' + drop.phone + ')' : '') + (drop.notes ? ' - ' + drop.notes : '');
    drop.opening = 0; drop.deleted = true; drop.mergedInto = keepId; drop.deletedAt = new Date().toISOString();
    if (partyBalance(st, keepId) !== before) { const s = JSON.parse(snap); st.parties = s.p; st.invoices = s.i; st.txns = s.t; fail('تعذر الدمج لأن الأرصدة لا تتطابق. لم يتغير شيء.'); }
    log(st, 'دمج طرفين', keepId, drop.name + ' ← ' + keep.name);
    return keep;
  }
  // اقتراحات فقط: لا يُدمج شيء إلا بعد تأكيدك
  function findDuplicateParties(st) {
    const live = st.parties.filter((p) => !p.deleted); const ign = new Set(st.settings.dupIgnored || []);
    const pairs = new Map();
    const add = (a, b, why) => {
      const k = [a.id, b.id].sort().join('|'); if (ign.has(k)) return;
      const e = pairs.get(k) || { a, b, why: [] }; if (!e.why.includes(why)) e.why.push(why); pairs.set(k, e);
    };
    const group = (keyFn, why) => { const m = new Map(); live.forEach((p) => { const k = keyFn(p); if (k) (m.get(k) || m.set(k, []).get(k)).push(p); }); m.forEach((arr) => { for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) add(arr[i], arr[j], why); }); };
    group((p) => normPhone(p.phone), 'نفس رقم الهاتف');
    group((p) => normName(p.name), 'نفس الاسم مع اختلاف بسيط في الكتابة');
    return [...pairs.values()].map((e) => {
      const pa = normPhone(e.a.phone), pb = normPhone(e.b.phone);
      return { a: e.a, b: e.b, why: e.why, phoneConflict: !!(pa && pb && pa !== pb), strong: e.why.length > 1 };
    });
  }
  function ignoreDuplicate(st, aId, bId) {
    const k = [aId, bId].sort().join('|'); st.settings.dupIgnored = st.settings.dupIgnored || [];
    if (!st.settings.dupIgnored.includes(k)) st.settings.dupIgnored.push(k);
    log(st, 'تجاهل اقتراح دمج', k, 'شخصان مختلفان');
  }

  /* ---------- الأصناف ---------- */
  function addItem(st, it) {
    if (!it.name || !String(it.name).trim()) fail('اسم الصنف مطلوب');
    const id = 'ITM-' + nextNo(st, 'ITM', 4);
    const item = {
      id, code: it.code || id, name: String(it.name).trim(), category: it.category || '', unit: it.unit || 'قطعة',
      cost: toQ(it.cost || 0), price: toQ(it.price || 0), openingQty: qty3(it.openingQty || 0),
      minQty: qty3(it.minQty || 0), notes: it.notes || '', createdAt: new Date().toISOString(),
    };
    if (st.items.find((x) => !x.deleted && x.code === item.code && x.id !== id)) fail('كود الصنف مستخدم من قبل');
    item.category = String(item.category || '').trim();
    st.items.push(item);
    if (item.category) ensureCategory(st, item.category);
    log(st, 'إضافة صنف', id, item.name);
    return item;
  }
  function updateItem(st, id, patch) {
    const it = st.items.find((x) => x.id === id); if (!it) fail('الصنف غير موجود');
    ['code', 'name', 'category', 'unit', 'notes'].forEach((k) => { if (patch[k] != null) it[k] = patch[k]; });
    ['cost', 'price'].forEach((k) => { if (patch[k] != null) it[k] = toQ(patch[k]); });
    ['openingQty', 'minQty'].forEach((k) => { if (patch[k] != null) it[k] = qty3(patch[k]); });
    it.category = String(it.category || '').trim();
    if (it.category) ensureCategory(st, it.category);
    log(st, 'تعديل صنف', id, it.name);
    return it;
  }


  /* ---------- فئات الأصناف ---------- */
  // الفئة اختيارية. اسم الفئة يُحفظ على الصنف نفسه، والقائمة في الإعدادات تسهّل الاختيار. حذف فئة لا يحذف أي صنف.
  function categoryList(st) { return (st.settings.categories || []).slice(); }
  function sameCat(a, b) { return normName(a) === normName(b); }
  function ensureCategory(st, name) {
    name = String(name || '').trim(); if (!name) return null;
    if (!Array.isArray(st.settings.categories)) st.settings.categories = [];
    const ex = st.settings.categories.find((c) => sameCat(c, name)); if (ex) return ex;
    st.settings.categories.push(name); return name;
  }
  function addCategory(st, name) {
    name = String(name || '').trim(); if (!name) fail('اكتب اسم الفئة');
    if (!Array.isArray(st.settings.categories)) st.settings.categories = [];
    if (st.settings.categories.some((c) => sameCat(c, name))) fail('هذه الفئة موجودة بالفعل');
    st.settings.categories.push(name); log(st, 'إضافة فئة', '', name); return name;
  }
  function renameCategory(st, oldName, newName) {
    newName = String(newName || '').trim(); if (!newName) fail('اكتب اسم الفئة');
    const list = st.settings.categories || []; const i = list.findIndex((c) => c === oldName); if (i < 0) fail('الفئة غير موجودة');
    if (list.some((c, j) => j !== i && sameCat(c, newName))) fail('يوجد فئة بنفس الاسم');
    let n = 0; st.items.forEach((it) => { if (it.category === oldName || sameCat(it.category, oldName)) { it.category = newName; n++; } });
    list[i] = newName; log(st, 'تعديل فئة', '', oldName + ' ← ' + newName + ' (' + n + ' صنف)'); return n;
  }
  // يحذف الفئة فقط. الأصناف تبقى كما هي وتصبح «بدون فئة».
  function deleteCategory(st, name) {
    const list = st.settings.categories || []; const i = list.findIndex((c) => c === name); if (i < 0) fail('الفئة غير موجودة');
    let n = 0; st.items.forEach((it) => { if (it.category && sameCat(it.category, name)) { it.category = ''; n++; } });
    list.splice(i, 1); log(st, 'حذف فئة', '', name + ' (' + n + ' صنف أصبحت بدون فئة)'); return n;
  }
  function categoryCount(st, name) { return st.items.filter((it) => !it.deleted && it.category && sameCat(it.category, name)).length; }
  // ترحيل: أي تصنيف مكتوب سابقًا على الأصناف يدخل قائمة الفئات (دون تغيير الأصناف)
  function syncCategories(st) {
    if (!Array.isArray(st.settings.categories)) { st.settings.categories = []; }
    let changed = false;
    st.items.forEach((it) => { if (it.category && String(it.category).trim()) { const before = st.settings.categories.length; const c = ensureCategory(st, it.category); if (c && c !== it.category && sameCat(c, it.category)) { it.category = c; changed = true; } if (st.settings.categories.length !== before) changed = true; } });
    return changed;
  }

  /* ---------- محرك المخزون (متوسط مرجح، إعادة تشغيل بالترتيب الزمني) ---------- */
  function stockEvents(st) {
    const ev = [];
    st.items.forEach((it) => {
      if (it.openingQty) ev.push({ k: 'open', itemId: it.id, qty: it.openingQty, unitCost: it.cost, date: '0000-00-00', seq: 0 });
    });
    st.invoices.forEach((inv) => {
      if (inv.voided) return;
      inv.lines.forEach((ln, i) => {
        ev.push({ k: inv.type, itemId: ln.itemId, qty: ln.qty, unit: ln.unit, date: inv.date, seq: inv.seq, inv, line: i, lineNet: ln.net });
      });
    });
    st.adjustments.forEach((a) => {
      if (a.voided) return;
      ev.push({ k: 'adjust', itemId: a.itemId, qty: a.delta, date: a.date, seq: a.seq, adj: a });
    });
    ev.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq));
    return ev;
  }

  function computeInventory(st) {
    const per = {};
    st.items.forEach((it) => { per[it.id] = { qty: 0, value: 0, avg: it.cost, purchased: 0, sold: 0, soldReturned: 0, purchaseReturned: 0, adjusted: 0 }; });
    const cogs = {}; // invoiceId -> cost of goods (for sale / sale_return)
    const retDiff = {}; // purchase return gain/loss by invoice
    const adjValue = {}; // adjustment id -> value delta
    const negatives = [];
    stockEvents(st).forEach((e) => {
      const s = per[e.itemId]; if (!s) return;
      if (e.k === 'open') { s.qty += e.qty; s.value += Math.round(e.qty * e.unitCost); s.avg = s.qty ? s.value / s.qty : s.avg; }
      else if (e.k === 'purchase') {
        s.qty += e.qty; s.value += e.lineNet; s.purchased += e.qty; s.avg = s.qty > 0 ? s.value / s.qty : s.avg;
      } else if (e.k === 'sale') {
        const c = Math.round(e.qty * s.avg); s.qty -= e.qty; s.value -= c; s.sold += e.qty;
        cogs[e.inv.id] = (cogs[e.inv.id] || 0) + c;
        if (s.qty < -1e-9) negatives.push({ itemId: e.itemId, invoice: e.inv.no, date: e.date });
        if (s.qty <= 1e-9) { s.value = Math.round(s.qty * s.avg); }
      } else if (e.k === 'sale_return') {
        const c = Math.round(e.qty * s.avg); s.qty += e.qty; s.value += c; s.soldReturned += e.qty;
        cogs[e.inv.id] = (cogs[e.inv.id] || 0) + c;
      } else if (e.k === 'purchase_return') {
        const c = Math.round(e.qty * s.avg); s.qty -= e.qty; s.value -= c; s.purchaseReturned += e.qty;
        retDiff[e.inv.id] = (retDiff[e.inv.id] || 0) + (e.lineNet - c);
        if (s.qty < -1e-9) negatives.push({ itemId: e.itemId, invoice: e.inv.no, date: e.date });
      } else if (e.k === 'adjust') {
        const c = Math.round(e.qty * s.avg); s.qty += e.qty; s.value += c; s.adjusted += e.qty;
        adjValue[e.adj.id] = c;
      }
    });
    let totalValue = 0;
    Object.values(per).forEach((s) => { s.qty = qty3(s.qty); s.value = Math.round(s.value); totalValue += Math.max(0, s.value); });
    return { per, cogs, retDiff, adjValue, totalValue, negatives };
  }

  function availableQty(st, itemId, excludeInvoiceId) {
    const clone = excludeInvoiceId ? { ...st, invoices: st.invoices.filter((i) => i.id !== excludeInvoiceId) } : st;
    const inv = computeInventory(clone);
    return inv.per[itemId] ? inv.per[itemId].qty : 0;
  }

  /* ---------- الحركات المالية ---------- */
  function seqOf(st) { return (st._seq = (st._seq || 0) + 1); }
  function reseq(st) {
    // يضمن ترتيبًا ثابتًا للحركات المتقاربة في التاريخ
    let m = 0;
    [...st.invoices, ...st.txns, ...st.adjustments].forEach((x) => { if (x.seq > m) m = x.seq; });
    st._seq = m;
  }

  const PARTNER_NATURE = {
    give: {
      advance: { label: 'سلفة مستحقة لي عنده', effect: 1 },
      funding: { label: 'تمويل له (مستحق لي)', effect: 1 },
      settle: { label: 'سداد لدين عليّ له', effect: 1 },
      his_share: { label: 'سحب من نصيبه من الأرباح', effect: 0, paidToPartnerProfit: true },
      other: { label: 'أخرى (أحدد الأثر)', effect: null },
    },
    recv: {
      repay: { label: 'سداد لدين سابق له عندي', effect: -1 },
      advance_to_me: { label: 'سلفة منه لي (مستحقة عليّ له)', effect: -1 },
      profit: { label: 'أرباح مستحقة لي', effect: 0, profitReceived: true },
      other: { label: 'تسوية أخرى (أحدد الأثر)', effect: null },
    },
    contribute: { capital: 'رأس مال', loan: 'قرض مني للتجارة', other: 'أخرى' },
    withdraw: { profit: 'سحب من أرباحي', capital: 'استرداد رأس مال', loan: 'سداد قرض لي', other: 'أخرى' },
  };

  const TXN_LABELS = {
    receipt: 'قبض من عميل', payment: 'دفع لمورد', expense: 'مصروف', transfer: 'تحويل بين حساباتي',
    contribute: 'أضفت من مالي للتجارة', withdraw: 'سحب من التجارة لحسابي',
    give_partner: 'مبلغ أعطيته لشريكي', recv_partner: 'مبلغ استلمته من شريكي',
    partner_adjust: 'تسوية مع الشريك (بدون نقدية)', profit_approve: 'اعتماد أرباح لي', opening: 'رصيد افتتاحي',
    other_in: 'حركة أخرى (داخل)', other_out: 'حركة أخرى (خارج)',
  };

  function addTxn(st, t) {
    const type = t.type;
    if (!TXN_LABELS[type]) fail('نوع الحركة غير معروف');
    const amount = toQ(t.amount);
    if (!(amount > 0)) fail('المبلغ يجب أن يكون أكبر من صفر');
    if (!t.date) fail('التاريخ مطلوب');
    const txn = {
      id: 'T-' + nextNo(st, 'T', 5), no: null, date: t.date, type, amount,
      acc: t.acc || 'trade', toAcc: t.toAcc || null, partyId: t.partyId || null, invoiceId: t.invoiceId || null,
      method: t.method || 'cash', note: t.note || '', nature: t.nature || null, category: t.category || null,
      scope: t.scope || null, paidBy: t.paidBy || null, partnerEffectAmount: 0, partnerEffectSign: 0,
      auto: !!t.auto, voided: false, seq: seqOf(st), createdAt: new Date().toISOString(),
    };
    txn.no = txn.id;
    if (!ACCOUNTS[txn.acc]) fail('الحساب غير معروف');
    if (txn.toAcc && !ACCOUNTS[txn.toAcc]) fail('الحساب المستفيد غير معروف');
    if (type === 'opening') {
      if (activeOpening(st, txn.acc)) fail('يوجد رصيد افتتاحي لهذا الحساب بالفعل. عدّله من شاشة الرصيد الافتتاحي بدل إضافة رصيد ثانٍ.');
      txn.nature = WORK_ACCS.includes(txn.acc) ? 'work_opening' : 'personal_opening';
    }
    const needParty = ['receipt', 'payment'].includes(type);
    if (needParty && !txn.partyId && !txn.invoiceId) fail('اختر الطرف');
    if (needParty && txn.partyId && !st.parties.find((p) => p.id === txn.partyId)) fail('الطرف غير موجود');
    if (type === 'transfer') {
      if (!txn.toAcc || txn.toAcc === txn.acc) fail('اختر حسابين مختلفين للتحويل');
    }
    if (type === 'contribute') { txn.acc = 'personal'; txn.toAcc = 'trade'; if (!txn.nature) fail('حدد طبيعة المبلغ: رأس مال أم قرض'); }
    if (type === 'withdraw') { txn.acc = 'trade'; txn.toAcc = 'personal'; if (!txn.nature) fail('حدد طبيعة السحب'); }
    if (type === 'give_partner') {
      const n = PARTNER_NATURE.give[txn.nature]; if (!n) fail('حدد طبيعة المبلغ الذي أعطيته لشريكك');
      if (n.effect === null) { txn.partnerEffectSign = (t.effectSign === '' || t.effectSign == null) ? NaN : Number(t.effectSign); if (![1, -1, 0].includes(txn.partnerEffectSign)) fail('حدد أثر الحركة على الرصيد'); if (!txn.note) fail('اكتب بيان الحركة'); }
      else txn.partnerEffectSign = n.effect;
    }
    if (type === 'recv_partner') {
      const n = PARTNER_NATURE.recv[txn.nature]; if (!n) fail('حدد طبيعة المبلغ الذي استلمته من شريكك');
      if (n.effect === null) { txn.partnerEffectSign = (t.effectSign === '' || t.effectSign == null) ? NaN : Number(t.effectSign); if (![1, -1, 0].includes(txn.partnerEffectSign)) fail('حدد أثر الحركة على الرصيد'); if (!txn.note) fail('اكتب بيان الحركة'); }
      else txn.partnerEffectSign = n.effect;
    }
    if (type === 'partner_adjust') {
      txn.partnerEffectSign = (t.effectSign === '' || t.effectSign == null) ? NaN : Number(t.effectSign);
      if (![1, -1].includes(txn.partnerEffectSign)) fail('حدد هل التسوية تزيد مستحقاتي أم تقللها');
      if (!txn.note) fail('اكتب بيان التسوية');
    }
    if (type === 'expense') {
      if (!txn.category) fail('اختر نوع المصروف');
      if (!['me', 'partner'].includes(txn.paidBy)) fail('حدد من دفع المصروف');
      if (!['trade', 'partner'].includes(txn.scope)) fail('حدد الجهة التي يخصها المصروف');
      if (txn.paidBy === 'partner' && txn.scope === 'partner') fail('مصروف شريكك الخاص الذي دفعه بنفسه لا يخصك');
      const owed = toQ(t.partnerAmount || 0);
      if (owed < 0 || owed > amount) fail('المبلغ المستحق بينكما لا يزيد عن مبلغ المصروف');
      txn.partnerEffectAmount = owed;
      // دفعته أنا: الشريك يدين لي (+)  | دفعه الشريك: أنا أدين له (-)
      txn.partnerEffectSign = txn.paidBy === 'me' ? 1 : -1;
    }
    if (type === 'other_in' || type === 'other_out') { if (!txn.note) fail('اكتب بيان الحركة'); }
    st.txns.push(txn);
    log(st, 'تسجيل حركة', txn.id, TXN_LABELS[type] + ' ' + toP(amount));
    return txn;
  }

  // أثر الحركة (يُحسب دائمًا من السجل)
  function txnEffect(t) {
    const e = { cash: { trade: 0, bank: 0, wallet: 0, personal: 0 }, party: 0, partner: 0, profitReceived: 0, profitApproved: 0, paidToPartnerProfit: 0 };
    if (t.voided) return e;
    const a = t.amount;
    switch (t.type) {
      case 'opening': e.cash[t.acc] += a; break;
      case 'receipt': e.cash[t.acc] += a; e.party = -a; break;
      case 'payment': e.cash[t.acc] -= a; e.party = a; break;
      case 'transfer': e.cash[t.acc] -= a; e.cash[t.toAcc] += a; break;
      case 'contribute': e.cash.personal -= a; e.cash.trade += a; break;
      case 'withdraw': e.cash.trade -= a; e.cash.personal += a; if (t.nature === 'profit') e.profitReceived = a; break;
      case 'give_partner': e.cash[t.acc] -= a; e.partner = t.partnerEffectSign * a;
        if (t.nature === 'his_share') e.paidToPartnerProfit = a; break;
      case 'recv_partner': e.cash[t.acc] += a; e.partner = t.partnerEffectSign * a;
        if (t.nature === 'profit') e.profitReceived = a; break;
      case 'partner_adjust': e.partner = t.partnerEffectSign * a; break;
      case 'profit_approve': e.profitApproved = a; break;
      case 'expense':
        if (t.paidBy === 'me') e.cash[t.acc] -= a;
        e.partner = t.partnerEffectSign * t.partnerEffectAmount; break;
      case 'other_in': e.cash[t.acc] += a; break;
      case 'other_out': e.cash[t.acc] -= a; break;
    }
    return e;
  }

  function voidTxn(st, id, reason) {
    const t = st.txns.find((x) => x.id === id); if (!t) fail('الحركة غير موجودة');
    if (t.voided) fail('الحركة ملغاة بالفعل');
    if (t.invoiceId && t.auto) fail('هذه حركة مرتبطة بفاتورة. عدّل الفاتورة أو ألغها بدل إلغاء الحركة.');
    t.voided = true; t.voidReason = reason || ''; t.voidedAt = new Date().toISOString();
    log(st, 'إلغاء حركة', id, reason || '');
    return t;
  }

  /* ---------- الفواتير ---------- */
  function normalizeLines(st, type, lines) {
    if (!lines || !lines.length) fail('أضف صنفًا واحدًا على الأقل');
    return lines.map((l, i) => {
      const item = st.items.find((x) => x.id === l.itemId); if (!item) fail('صنف غير موجود في السطر ' + (i + 1));
      const qty = qty3(l.qty); if (!(qty > 0)) fail('الكمية يجب أن تكون أكبر من صفر: ' + item.name);
      const unit = toQ(l.unit); if (unit < 0) fail('السعر غير صحيح: ' + item.name);
      const discount = toQ(l.discount || 0); // خصم على السطر بالمبلغ
      const gross = Math.round(qty * unit);
      if (discount < 0 || discount > gross) fail('الخصم أكبر من إجمالي الصنف: ' + item.name);
      return { itemId: item.id, name: item.name, qty, unit, discount, net: gross - discount };
    });
  }

  function createInvoice(st, d, opts) {
    opts = opts || {};
    const meta = INVOICE_TYPES[d.type]; if (!meta) fail('نوع الفاتورة غير معروف');
    if (!d.date) fail('التاريخ مطلوب');
    if (!d.partyId) fail('اختر الطرف');
    const party = st.parties.find((p) => p.id === d.partyId); if (!party) fail('الطرف غير موجود');
    const lines = normalizeLines(st, d.type, d.lines);
    const sub = lines.reduce((s, l) => s + l.net, 0);
    const extraDiscount = toQ(d.discount || 0);
    if (extraDiscount < 0 || extraDiscount > sub) fail('خصم الفاتورة غير صحيح');
    const total = sub - extraDiscount;
    // طريقة الدفع: كاش = مدفوعة بالكامل، آجل = لا شيء مدفوع، دفع جزئي = المبلغ المكتوب فقط. (بدونها يعمل المحرك كما كان)
    const payMode = d.payMode || null;
    if (payMode && !['cash', 'credit', 'partial'].includes(payMode)) fail('طريقة الدفع غير معروفة');
    let paid = toQ(d.paid || 0);
    if (payMode === 'partial') {
      if (paid < 0) fail('المبلغ المدفوع لا يمكن أن يكون سالبًا');
      if (!(paid > 0)) fail('اكتب المبلغ الذي تم دفعه فعلًا');
    }
    if (payMode === 'cash') paid = total;
    if (payMode === 'credit') paid = 0;
    if (paid < 0) fail('المبلغ المدفوع غير صحيح');
    if (paid > total) fail('المبلغ المدفوع أكبر من إجمالي الفاتورة. سجّل الزيادة كقبض/دفع منفصل.');
    const inv = {
      id: opts.reuseId || (meta.prefix + '-' + nextNo(st, meta.prefix, 4)), type: d.type, date: d.date, partyId: d.partyId,
      lines, subtotal: sub, discount: extraDiscount, total, paid, remaining: total - paid,
      method: d.method || 'cash', payMode, acc: d.acc || 'trade', note: d.note || '', refInvoice: d.refInvoice || null,
      voided: false, revision: opts.revision || 0, seq: opts.keepSeq || seqOf(st), createdAt: new Date().toISOString(),
    };
    inv.no = inv.id;
    // منع البيع بأكثر من المتاح
    if (['sale', 'purchase_return'].includes(d.type) && !st.settings.allowNegativeStock) {
      const probe = { ...st, invoices: [...st.invoices, inv] };
      const bad = computeInventory(probe).negatives.find((n) => n.invoice === inv.no);
      if (bad) {
        const it = st.items.find((x) => x.id === bad.itemId);
        const have = availableQty(st, bad.itemId, opts.reuseId ? inv.id : null);
        fail('الكمية المتاحة من "' + (it ? it.name : '') + '" غير كافية (المتاح ' + have + '). يمكنك السماح بالمخزون السالب من الإعدادات.');
      }
    }
    st.invoices.push(inv);
    if (paid > 0) {
      const incoming = d.type === 'sale' || d.type === 'purchase_return';
      addTxn(st, {
        type: incoming ? 'receipt' : 'payment', date: d.date, amount: toP(paid), acc: inv.acc, partyId: inv.partyId,
        invoiceId: inv.id, method: inv.method, note: meta.label + ' ' + inv.no, auto: true,
      });
    }
    if (!opts.silent) log(st, 'اعتماد ' + meta.label, inv.id, 'إجمالي ' + toP(total));
    return inv;
  }

  function voidInvoice(st, id, reason, silent) {
    const inv = st.invoices.find((x) => x.id === id); if (!inv) fail('الفاتورة غير موجودة');
    if (inv.voided) fail('الفاتورة محذوفة بالفعل');
    if (!st.settings.allowNegativeStock) {
      const key = (n) => n.itemId + '|' + n.invoice;
      const beforeKeys = new Set(computeInventory(st).negatives.map(key));
      const probe = { ...st, invoices: st.invoices.map((i) => (i.id === id ? { ...i, voided: true } : i)) };
      const bad = computeInventory(probe).negatives.find((n) => !beforeKeys.has(key(n)));
      if (bad) { const it = st.items.find((x) => x.id === bad.itemId); fail('لا يمكن حذف هذه الفاتورة، لأن الكمية التي أدخلتها من "' + (it ? it.name : '') + '" بِيعت بعدها (الفاتورة ' + bad.invoice + '). عدّل أو احذف تلك الفاتورة أولًا، أو فعّل المخزون السالب من الإعدادات.'); }
    }
    inv.voided = true; inv.voidReason = reason || ''; inv.voidedAt = new Date().toISOString();
    st.txns.forEach((t) => { if (t.invoiceId === id && !t.voided) { t.voided = true; t.voidReason = 'حذف الفاتورة ' + id; } });
    if (!silent) log(st, 'حذف فاتورة', id, reason || '');
    return inv;
  }

  // تعديل = إلغاء النسخة القديمة وحفظ نسخة جديدة بنفس الرقم (بدون تكرار الأثر)
  function editInvoice(st, id, d) {
    const old = st.invoices.find((x) => x.id === id); if (!old) fail('الفاتورة غير موجودة');
    if (old.voided) fail('لا يمكن تعديل فاتورة محذوفة');
    const negKey = (n) => n.itemId + '|' + n.invoice;
    const negBefore = new Set(computeInventory(st).negatives.map(negKey));
    const snapshot = JSON.stringify({ st_invoices: st.invoices, st_txns: st.txns, counters: st.counters, _seq: st._seq });
    try {
      const keepSeq = old.seq; const rev = (old.revision || 0) + 1;
      // احتفظ بنسخة قديمة مؤرشفة بمعرّف مختلف
      const archive = JSON.parse(JSON.stringify(old)); archive.id = id + '#r' + (old.revision || 0); archive.no = archive.id; archive.voided = true; archive.voidReason = 'نسخة قديمة قبل التعديل'; archive.archived = true;
      st.txns.forEach((t) => { if (t.invoiceId === id && !t.voided) { t.voided = true; t.voidReason = 'تعديل الفاتورة ' + id; } });
      st.invoices = st.invoices.filter((x) => x.id !== id);
      st.invoices.push(archive);
      const inv = createInvoice(st, { ...d, type: old.type }, { reuseId: id, revision: rev, keepSeq, silent: true });
      if (!st.settings.allowNegativeStock) {
        const bad = computeInventory(st).negatives.find((n) => !negBefore.has(negKey(n)));
        if (bad) { const it = st.items.find((x) => x.id === bad.itemId); fail('لا يمكن حفظ هذا التعديل، لأنه يجعل الكمية المتاحة من "' + (it ? it.name : '') + '" غير كافية لفاتورة أخرى (' + bad.invoice + '). عدّل تلك الفاتورة أولًا أو فعّل المخزون السالب من الإعدادات.'); }
      }
      log(st, 'تعديل فاتورة', id, 'نسخة ' + rev);
      return inv;
    } catch (e) {
      const s = JSON.parse(snapshot); st.invoices = s.st_invoices; st.txns = s.st_txns; st.counters = s.counters; st._seq = s._seq;
      throw e;
    }
  }

  function addAdjustment(st, d) {
    const it = st.items.find((x) => x.id === d.itemId); if (!it) fail('الصنف غير موجود');
    const delta = qty3(d.delta); if (!delta) fail('أدخل الفرق في الكمية (موجب أو سالب)');
    if (!d.reason || !String(d.reason).trim()) fail('اكتب سبب التسوية (جرد، تلف، فقد...)');
    const adj = { id: 'ADJ-' + nextNo(st, 'ADJ', 4), date: d.date || today(), itemId: it.id, delta, reason: d.reason, voided: false, seq: seqOf(st) };
    if (delta < 0 && !st.settings.allowNegativeStock) {
      if (availableQty(st, it.id) + delta < -1e-9) fail('التسوية تجعل المخزون سالبًا');
    }
    st.adjustments.push(adj);
    log(st, 'تسوية مخزون', adj.id, it.name + ' ' + delta);
    return adj;
  }

  /* ---------- الأرصدة وكشوف الحساب ---------- */
  function partyStatement(st, partyId, from, to) {
    const party = st.parties.find((p) => p.id === partyId); if (!party) fail('الطرف غير موجود');
    const rows = [];
    st.invoices.forEach((inv) => {
      if (inv.voided || inv.partyId !== partyId) return;
      const sign = { sale: 1, purchase: -1, sale_return: -1, purchase_return: 1 }[inv.type];
      rows.push({ date: inv.date, seq: inv.seq, kind: INVOICE_TYPES[inv.type].label, ref: inv.no, amount: sign * inv.total, note: inv.note });
    });
    st.txns.forEach((t) => {
      if (t.voided || t.partyId !== partyId) return;
      const e = txnEffect(t);
      if (e.party) rows.push({ date: t.date, seq: t.seq, kind: TXN_LABELS[t.type], ref: t.no, amount: e.party, note: t.note || '' });
    });
    rows.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq));
    let bal = party.opening;
    const opening = party.opening;
    const out = [];
    let periodOpening = opening;
    rows.forEach((r) => {
      if (from && r.date < from) { periodOpening += r.amount; bal += r.amount; return; }
      if (to && r.date > to) return;
      bal += r.amount; out.push({ ...r, balance: bal });
    });
    return { party, opening: periodOpening, rows: out, closing: bal, text: describeBalance(bal) };
  }

  function partyBalance(st, partyId) {
    const s = partyStatement(st, partyId); return s.closing;
  }

  function describeBalance(bal) {
    if (bal > 0) return { dir: 'له عليه', label: 'مدين لي (مستحق لي عنده)', cls: 'pos' };
    if (bal < 0) return { dir: 'عليّ له', label: 'دائن (مستحق عليّ له)', cls: 'neg' };
    return { dir: 'متزن', label: 'الحساب متزن', cls: 'zero' };
  }

  function partnerStatement(st, from, to) {
    const rows = [];
    st.txns.forEach((t) => {
      if (t.voided) return;
      const e = txnEffect(t);
      const relevant = e.partner || e.profitReceived || e.profitApproved || e.paidToPartnerProfit || ['give_partner', 'recv_partner', 'partner_adjust', 'profit_approve'].includes(t.type) || (t.type === 'expense' && t.partnerEffectAmount);
      if (!relevant) return;
      let label = TXN_LABELS[t.type];
      if (t.nature && PARTNER_NATURE.give[t.nature] && t.type === 'give_partner') label += ' - ' + PARTNER_NATURE.give[t.nature].label;
      if (t.nature && PARTNER_NATURE.recv[t.nature] && t.type === 'recv_partner') label += ' - ' + PARTNER_NATURE.recv[t.nature].label;
      if (t.type === 'expense') label = (t.paidBy === 'me' ? 'مصروف دفعته أنا' : 'مصروف دفعه شريكي') + ' (' + t.category + ')' + (t.scope === 'partner' ? ' - يخصه' : ' - يخص التجارة');
      rows.push({ date: t.date, seq: t.seq, ref: t.no, label, amount: t.amount, balanceEffect: e.partner, profitReceived: e.profitReceived, profitApproved: e.profitApproved, paidToPartnerProfit: e.paidToPartnerProfit, note: t.note || '' });
    });
    rows.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq));
    let bal = 0, opening = 0;
    const out = [];
    rows.forEach((r) => {
      if (from && r.date < from) { opening += r.balanceEffect; bal += r.balanceEffect; return; }
      if (to && r.date > to) return;
      bal += r.balanceEffect; out.push({ ...r, balance: bal });
    });
    return { opening, rows: out, closing: bal, text: bal > 0 ? { label: 'مستحق لي عند شريكي', cls: 'pos' } : bal < 0 ? { label: 'مستحق عليّ لشريكي', cls: 'neg' } : { label: 'متزن', cls: 'zero' } };
  }

  /* ---------- الأرباح ---------- */
  function computeProfit(st, from, to) {
    const inRange = (d) => (!from || d >= from) && (!to || d <= to);
    const inv = computeInventory(st);
    let sales = 0, saleReturns = 0, cogsSales = 0, cogsReturns = 0, purchaseReturnDiff = 0, purchases = 0, purchaseReturns = 0;
    let missingCost = false;
    st.invoices.forEach((i) => {
      if (i.voided || !inRange(i.date)) return;
      if (i.type === 'sale') { sales += i.total; cogsSales += inv.cogs[i.id] || 0; if (!(inv.cogs[i.id] > 0) && i.total > 0) missingCost = true; }
      else if (i.type === 'sale_return') { saleReturns += i.total; cogsReturns += inv.cogs[i.id] || 0; }
      else if (i.type === 'purchase') purchases += i.total;
      else if (i.type === 'purchase_return') { purchaseReturns += i.total; purchaseReturnDiff += inv.retDiff[i.id] || 0; }
    });
    let expenses = 0;
    st.txns.forEach((t) => { if (!t.voided && t.type === 'expense' && t.scope === 'trade' && inRange(t.date)) expenses += t.amount; });
    let adjust = 0;
    st.adjustments.forEach((a) => { if (!a.voided && inRange(a.date)) adjust += inv.adjValue[a.id] || 0; });
    const netSales = sales - saleReturns;
    const cogs = cogsSales - cogsReturns;
    const gross = netSales - cogs;
    const net = gross + purchaseReturnDiff + adjust - expenses;
    const warnings = [];
    if (missingCost) warnings.push('بعض المبيعات بتكلفة صفر (صنف بلا تكلفة شراء). الربح قد يكون أكبر من الحقيقي. سجّل تكلفة الأصناف أو فواتير الشراء.');
    if (inv.negatives.length) warnings.push('يوجد مخزون سالب مؤقت في بعض الأصناف، لذلك تكلفة البضاعة المباعة تقديرية.');
    if (!st.invoices.some((i) => !i.voided && i.type === 'sale' && inRange(i.date))) warnings.push('لا توجد مبيعات في هذه الفترة.');
    const share = st.settings.myShare / 100;
    const myShareAmt = Math.round(net * share);
    // الاعتماد والاستلام (كل الفترات، لأنها حقوق تراكمية)
    let approved = 0, received = 0, receivedFromPartner = 0, receivedFromTrade = 0, paidToPartnerProfit = 0;
    st.txns.forEach((t) => {
      if (t.voided) return; const e = txnEffect(t);
      approved += e.profitApproved; received += e.profitReceived; paidToPartnerProfit += e.paidToPartnerProfit;
      if (t.type === 'recv_partner') receivedFromPartner += e.profitReceived;
      if (t.type === 'withdraw') receivedFromTrade += e.profitReceived;
    });
    return {
      sales, saleReturns, netSales, cogs, gross, expenses, adjust, purchaseReturnDiff, net, purchases, purchaseReturns,
      myShareAmt, share: st.settings.myShare, approved, received, receivedFromPartner, receivedFromTrade, paidToPartnerProfit,
      dueApproved: approved - received, notYetApproved: myShareAmt - approved,
      complete: warnings.filter((w) => !w.startsWith('لا توجد')).length === 0, warnings,
    };
  }

  /* ---------- ملخص لوحة التحكم ---------- */
  function cashBalances(st) {
    const oc = st.settings.openingCash || {};
    const c = {}; Object.keys(ACCOUNTS).forEach((k) => { c[k] = oc[k] || 0; });
    st.txns.forEach((t) => { const e = txnEffect(t); Object.keys(ACCOUNTS).forEach((k) => { c[k] += e.cash[k] || 0; }); });
    return c;
  }

  // حركة النقدية الفعلية: ما دخل وما خرج فعلًا فقط. التحويلات بين الخزن والحسابات (وإيداع/سحب الشريك الداخلي) صافيها صفر فلا تُحتسب دخلًا ولا خرجًا.
  // الرصيد = الافتتاحي + ما دخل − ما خرج، وهو مطابق دائمًا لمجموع أرصدة الحسابات (cashBalances).
  function cashFlow(st, from, to) {
    const inRange = (d) => (!from || d >= from) && (!to || d <= to);
    const oc = st.settings.openingCash || {};
    let opening = 0; Object.keys(ACCOUNTS).forEach((k) => { opening += oc[k] || 0; });
    let inflow = 0, outflow = 0, receipts = 0, payments = 0, expensesPaid = 0, otherIn = 0, otherOut = 0;
    st.txns.forEach((t) => {
      if (t.voided || !inRange(t.date)) return;
      const e = txnEffect(t); let d = 0; Object.keys(ACCOUNTS).forEach((k) => { d += e.cash[k] || 0; });
      if (t.type === 'opening') { opening += d; return; }
      if (d > 0) inflow += d; else if (d < 0) outflow += -d;
      if (t.type === 'receipt') receipts += t.amount; else if (t.type === 'payment') payments += t.amount;
      else if (t.type === 'expense' && d < 0) expensesPaid += -d;
      else if (d > 0) otherIn += d; else if (d < 0) otherOut += -d;
    });
    return { opening, inflow, outflow, net: opening + inflow - outflow, receipts, payments, expensesPaid, otherIn, otherOut };
  }

  function dashboard(st, from, to) {
    const inRange = (d) => (!from || d >= from) && (!to || d <= to);
    const inv = computeInventory(st);
    const profit = computeProfit(st, from, to);
    const cash = cashBalances(st);
    let collected = 0, paidSup = 0;
    st.txns.forEach((t) => {
      if (t.voided || !inRange(t.date)) return;
      if (t.type === 'receipt') collected += t.amount;
      if (t.type === 'payment') paidSup += t.amount;
    });
    let receivable = 0, payable = 0;
    st.parties.forEach((p) => { if (p.deleted) return; const b = partyBalance(st, p.id); if (b > 0) receivable += b; else payable += -b; });
    const ps = partnerStatement(st);
    const flowAll = cashFlow(st), flowPeriod = cashFlow(st, from, to);
    return {
      flowAll, flowPeriod, actualCash: flowAll.net,
      cash, totalCash: cash.trade + cash.bank + cash.wallet + cash.personal, workCash: cash.trade + cash.bank + cash.wallet, sales: profit.netSales, purchases: profit.purchases - profit.purchaseReturns,
      expenses: profit.expenses, collected, paidSup, receivable, payable, inventoryValue: inv.totalValue,
      profit, partnerBalance: ps.closing, partnerText: ps.text,
      lowStock: st.items.filter((i) => !i.deleted && inv.per[i.id] && inv.per[i.id].qty <= i.minQty && i.minQty > 0).length,
    };
  }

  /* ---------- الرصيد الافتتاحي ---------- */
  // حركة مستقلة من نوع opening: تدخل في أرصدة الحسابات فقط، ولا تدخل في المبيعات أو المشتريات أو المصروفات أو الأرباح أو المساهمات الشخصية.
  function activeOpening(st, acc) { return st.txns.find((t) => t.type === 'opening' && !t.voided && t.acc === acc) || null; }
  function recordsBefore(st, date) {
    if (!date) return 0;
    return st.invoices.filter((i) => !i.voided && !i.archived && i.date < date).length + st.txns.filter((t) => !t.voided && t.type !== 'opening' && t.date < date).length;
  }
  // يضبط الأرصدة الافتتاحية دفعة واحدة. التعديل = إلغاء الحركة القديمة وتسجيل بديلها، فلا يُحتسب الرصيد مرتين أبدًا.
  function saveOpenings(st, d) {
    if (!d.date) fail('اختر تاريخ بداية التسجيل');
    const keys = Object.keys(ACCOUNTS); const amounts = d.amounts || {};
    keys.forEach((k) => { if (toQ(amounts[k] || 0) < 0) fail('الرصيد الافتتاحي لا يمكن أن يكون سالبًا: ' + ACCOUNTS[k]); });
    let changed = 0;
    keys.forEach((k) => {
      const v = toQ(amounts[k] || 0); const old = activeOpening(st, k);
      if (!old && v === 0) return;
      if (old && old.amount === v && old.date === d.date && (old.userNote || '') === (d.note || '')) return;
      if (old) { old.voided = true; old.voidReason = 'تعديل الرصيد الافتتاحي'; old.voidedAt = new Date().toISOString(); log(st, 'تعديل رصيد افتتاحي', old.id, ACCOUNTS[k] + ': من ' + toP(old.amount) + ' إلى ' + toP(v)); }
      if (v > 0) {
        const label = WORK_ACCS.includes(k) ? 'رصيد أموال الشغل عند بداية التسجيل - ' + ACCOUNTS[k] : 'رصيد افتتاحي لأموالي الشخصية';
        const t = addTxn(st, { type: 'opening', date: d.date, amount: toP(v), acc: k, note: label + (d.note ? ' - ' + d.note : '') });
        t.userNote = d.note || '';
      }
      changed++;
    });
    st.settings.startDate = d.date;
    log(st, 'ضبط الرصيد الافتتاحي', '', 'تاريخ البداية ' + d.date);
    return changed;
  }
  // ينقل الرصيد القديم المخزّن في الإعدادات إلى حركات افتتاحية مستقلة (مرة واحدة، دون تغيير الأرصدة)
  function migrateOpening(st) {
    const oc = st.settings.openingCash || {}; let moved = false;
    const keys = Object.keys(oc).filter((k) => ACCOUNTS[k] && oc[k] > 0 && !activeOpening(st, k));
    if (!keys.length) return false;
    const dates = st.invoices.filter((i) => !i.archived).map((i) => i.date).concat(st.txns.map((t) => t.date)).filter(Boolean).sort();
    const date = st.settings.startDate || dates[0] || today();
    keys.forEach((k) => { const t = addTxn(st, { type: 'opening', date, amount: toP(oc[k]), acc: k, note: 'رصيد افتتاحي (منقول من الإعدادات)' }); t.userNote = ''; oc[k] = 0; moved = true; });
    st.settings.startDate = date;
    return moved;
  }

  /* ---------- نسخ احتياطي ---------- */
  function exportBackup(st) { return JSON.stringify({ app: 'alamer-accounts', version: 1, exportedAt: new Date().toISOString(), state: st }); }
  function parseBackup(text) {
    let o; try { o = JSON.parse(text); } catch (e) { fail('الملف ليس نسخة احتياطية صالحة'); }
    if (!o || o.app !== 'alamer-accounts' || !o.state) fail('هذا الملف ليس نسخة احتياطية من هذا البرنامج');
    const base = emptyState();
    const s = Object.assign(base, o.state);
    s.settings = Object.assign(base.settings, o.state.settings || {});
    s.settings.openingCash = Object.assign({ trade: 0, personal: 0 }, (o.state.settings || {}).openingCash || {});
    s.counters = Object.assign(base.counters, o.state.counters || {});
    ['parties', 'items', 'invoices', 'txns', 'adjustments', 'audit'].forEach((k) => { if (!Array.isArray(s[k])) s[k] = []; });
    reseq(s);
    if (migrateOpening(s)) s._migrated = true;
    if (syncCategories(s)) s._migrated = true;
    s.parties.forEach((p) => { if (p.kind !== 'both') { p.kind = 'both'; s._migrated = true; } }); // كل الأطراف موحّدة: عميل ومورد
    return s;
  }

  const api = {
    toQ, toP, qty3, ACCOUNTS, WORK_ACCS, normName, normPhone, partyUsage, deleteParty, mergeParties, findDuplicateParties, ignoreDuplicate, activeOpening, recordsBefore, saveOpenings, migrateOpening, INVOICE_TYPES, EXPENSE_CATS, PARTNER_NATURE, TXN_LABELS, emptyState, today, reseq,
    addParty, updateParty, addItem, updateItem, addTxn, voidTxn, txnEffect, createInvoice, editInvoice, voidInvoice, addAdjustment,
    computeInventory, availableQty, partyStatement, partyBalance, describeBalance, partnerStatement, computeProfit, cashBalances, cashFlow, categoryList, addCategory, renameCategory, deleteCategory, categoryCount, ensureCategory, syncCategories,
    dashboard, exportBackup, parseBackup,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Alamer = api;
})(typeof window !== 'undefined' ? window : globalThis);

const THEME_KEY = 'alamer_theme';
function getTheme() { try { const v = localStorage.getItem(THEME_KEY); return v === 'light' || v === 'dark' ? v : 'auto'; } catch (e) { return 'auto'; } }
function effectiveDark() { const t = getTheme(); if (t !== 'auto') return t === 'dark'; try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; } }
function applyTheme() { const t = getTheme(); const el = document.documentElement; if (t === 'auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', t); }
function setTheme(m) { try { if (m === 'auto') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, m); } catch (e) {} applyTheme(); }
applyTheme();
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = (n) => String(n).padStart(2, '0');
const localToday = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const monthStart = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-01'; };
const fmtN = (q) => (Math.abs(q) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const M = (q) => '<span class="m">' + (q < 0 ? '−' : '') + fmtN(q) + ' ج.م</span>';
const Mt = (q) => (q < 0 ? '−' : '') + fmtN(q) + ' ج.م';
const num = (s) => {
  if (s == null) return 0;
  let t = String(s).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g, '.').replace(/[,،٬\s]/g, '');
  const v = parseFloat(t); return isFinite(v) ? v : 0;
};

let S = A.emptyState();
let saveMode = 'local'; // local | cloud
let saveInfo = 'جاري التحميل';
let dbCol = null, lastSaved = {}, saving = false, dirty = false, uidReady = false, savedAt = 0;
let cloudChecked = false, persisted = null, installEvt = null;

function hydrate(state) { return A.parseBackup(JSON.stringify({ app: 'alamer-accounts', state })); }
function lsRead() { try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify({ savedAt, state: S })); } catch (e) {} }
const safeKey = (s) => String(s).replace(/[^A-Za-z0-9_-]/g, '_');

function buildDocs() {
  const docs = {};
  docs.meta = { t: 'meta', savedAt, d: { v: S.v, settings: S.settings, counters: S.counters, _seq: S._seq || 0 } };
  const chunk = (arr, size, pre) => { for (let i = 0; i < arr.length; i += size) docs[pre + '_' + pad2(Math.floor(i / size))] = { t: pre, d: arr.slice(i, i + size) }; };
  chunk(S.parties, 120, 'parties'); chunk(S.items, 120, 'items'); chunk(S.invoices, 40, 'invoices');
  chunk(S.txns, 120, 'txns'); chunk(S.adjustments, 120, 'adjustments'); chunk(S.audit, 150, 'audit');
  return docs;
}
async function flushDb() {
  if (!dbCol) return;
  if (saving) { dirty = true; return; }
  saving = true; dirty = false;
  try {
    const docs = buildDocs(); const next = {};
    for (const k of Object.keys(docs)) {
      const j = JSON.stringify(docs[k]); next[k] = j;
      if (k === 'meta') { const old = lastSaved[k] ? JSON.parse(lastSaved[k]) : null; if (old && JSON.stringify(old.d) === JSON.stringify(docs[k].d)) { next[k] = lastSaved[k]; continue; } }

function stmtReport(f) { if (!f.party1) return { cols: [], rows: [], msg: 'اختر الطرف لعرض كشف حسابه (حساب واحد موحد حتى لو كان عميلًا ومورّدًا).' }; const [a, b] = rng(f); const s = A.partyStatement(S, f.party1, a, b); const rows = [['', 'رصيد أول المدة', '', '', C(s.opening)]].concat(s.rows.map((r) => [fmtDate(r.date), r.kind + ' ' + r.ref, C(r.amount), r.note, C(r.balance)])); return { cols: ['التاريخ', 'البيان', 'الحركة (+ لي / − عليّ)', 'ملاحظات', 'الرصيد'], num: [2, 4], rows, foot: ['', 'الرصيد النهائي: ' + s.text.label, '', '', C(s.closing)] }; }

    case 'itmCat': UI.itmCat = d.c || ''; render(); break;

    case 'catAdd': { const v = ($('#sheetForm').elements.catNew.value || '').trim(); if (commit(() => A.addCategory(S, v), 'تمت إضافة الفئة').ok) openCategories(); break; }
    case 'catEdit': { const old = A.categoryList(S)[+d.i]; openSheet('تعديل اسم الفئة', '<div class="fields">' + field('اسم الفئة', inp('name', old)) + '<div class="hint">سيتغير اسم الفئة في كل الأصناف التابعة لها (' + A.categoryCount(S, old) + ' صنف).</div></div>', { onSubmit(fd) { const r = commit(() => A.renameCategory(S, old, fd.get('name')), 'تم تعديل الفئة'); if (r.ok) { if (UI.itmCat === old) UI.itmCat = String(fd.get('name')).trim(); setTimeout(openCategories, 0); } return r.ok; } }); break; }
    case 'catDel': { const old = A.categoryList(S)[+d.i]; const n = A.categoryCount(S, old); openSheet('حذف الفئة', '<div class="info">سيتم حذف الفئة «' + esc(old) + '» فقط. ' + (n ? 'الأصناف التابعة لها (' + n + ') <b>لن تُحذف</b> وستصبح «بدون فئة».' : 'لا توجد أصناف عليها.') + ' لا يتأثر المخزون ولا الفواتير.</div>', { submit: 'تأكيد حذف الفئة', onSubmit() { const r = commit(() => A.deleteCategory(S, old), 'تم حذف الفئة'); if (r.ok) { if (UI.itmCat === old) UI.itmCat = ''; setTimeout(openCategories, 0); } return r.ok; } }); $('#sheetOk').classList.add('danger'); break; }
    case 'newItem': openItemForm(); break;
    case 'editItem': openItemForm(S.items.find((x) => x.id === d.id)); break;
    case 'openItem': go('item', { id: d.id }); break;
    case 'adjust': openAdjust(d.id); break;
    case 'openingForm': closeSheet(); openOpeningForm(); break;
    case 'newTxn': closeSheet(); if (d.t === 'profit_approve') openProfitApprove(); else openTxnForm(d.t, { party: d.party }); break;
    case 'viewTxn': viewTxn(d.id); break;
    case 'voidTxn': closeSheet(); reasonSheet('إلغاء الحركة', 'ستُعكس الحركة من الأرصدة وتبقى في السجل كحركة ملغاة.', (r) => commit(() => A.voidTxn(S, d.id, r), 'تم إلغاء الحركة').ok); break;
    case 'newExp': closeSheet(); openExpenseForm(); break;
    case 'pGive': openPartnerTxn('give'); break;
    case 'pRecv': closeSheet(); openPartnerTxn('recv'); break;
    case 'pExpByHim': openPartnerExpByHim(); break;
    case 'pAdjust': openPartnerAdjust(); break;
    case 'openReport': UI.rf = {}; go('report', { id: d.id }); break;
    case 'csvReport': { const r = REPORTS.find((x) => x.id === d.id); const out = r.build(UI.rf || {}); if (out.msg) { toast(out.msg, true); break; } saveFile(r.id + '-' + localToday() + '.csv', toCsv(out)); break; }
    case 'saveSettings': {
      const fm = $('#setForm'); const share = num(fm.elements.myShare.value);
      if (share < 0 || share > 100) { toast('نسبة الأرباح يجب أن تكون بين 0 و100', true); break; }
      S.settings.shopName = fm.elements.shopName.value || S.settings.shopName; S.settings.myShare = share; S.settings.allowNegativeStock = fm.elements.neg.checked;
      persist(); toast('تم حفظ الإعدادات'); render(); break; }
    case 'backup': saveFile('alamer-backup-' + localToday() + '.json', A.exportBackup(S)).then((ok) => { if (ok) { markBackup(); render(); } }); break;
    case 'installApp': if (installEvt) { const ev = installEvt; ev.prompt(); ev.userChoice.then(() => { installEvt = null; render(); }); } break;
    case 'restore':
      openSheet('استعادة نسخة احتياطية', '<div class="info">تنبيه: الاستعادة تستبدل بيانات البرنامج الحالية بمحتوى الملف. صدّر نسخة من بياناتك الحالية أولًا.</div><label class="f"><span>اختر ملف النسخة (.json)</span><input type="file" id="bkFile" accept=".json,application/json"></label><label class="f"><span>أو الصق محتوى النسخة هنا</span><textarea id="bkText" style="direction:ltr"></textarea></label>', {
        submit: 'استعادة', onSubmit() { const f = $('#bkFile').files[0]; const txt = $('#bkText').value.trim();
          const apply = (t) => { try { const st = A.parseBackup(t); S = st; persist(); render(); toast('تمت الاستعادة بنجاح'); } catch (e) { toast(e.userMessage || 'تعذرت الاستعادة', true); } };
          if (f) { const rd = new FileReader(); rd.onload = () => apply(String(rd.result)); rd.readAsText(f); return true; }
          if (txt) { apply(txt); return true; } toast('اختر ملفًا أو الصق النص', true); return false; } });
      break;
    case 'reset': reasonSheet('حذف كل البيانات', 'سيُحذف كل شيء نهائيًا. صدّر نسخة احتياطية أولًا. اكتب كلمة «حذف» في خانة السبب للتأكيد.', (r) => { if (String(r).trim() !== 'حذف') { toast('اكتب كلمة حذف للتأكيد', true); return false; } S = A.emptyState(); persist(); render(); toast('تم حذف البيانات'); return true; }); break;
  }
});
document.addEventListener('submit', (e) => e.preventDefault()); // لا يُعاد تحميل الصفحة من أي نموذج
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('row')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && $('#pov')) { closePicker(); return; } if (e.key === 'Escape') closeSheet(); });
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.key;
  if (k) { UI[k] = e.target.value; const l = $('#list'); if (l) l.innerHTML = k.startsWith('inv_') ? invListHtml(k.slice(4)) : k === 'pty' ? partyListHtml() : itemListHtml(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'pFrom' || t.id === 'pTo') { period.from = $('#pFrom').value; period.to = $('#pTo').value; render(); return; }
  if (t.dataset && t.dataset.ui) { UI[t.dataset.ui] = t.value; render(); return; }
  if (t.dataset && t.dataset.rf) { (UI.rf || (UI.rf = {}))[t.dataset.rf] = t.value; const r = REPORTS.find((x) => x.id === view.id); const rep = $('#rep'); if (rep && r) rep.innerHTML = reportTable(r.build(UI.rf)); }
});

/* ---------------- البدء ---------------- */
const local = lsRead();
if (local && local.state) { try { S = hydrate(local.state); savedAt = local.savedAt || 0; saveInfo = 'محفوظ على هذا الجهاز'; } catch (e) { S = A.emptyState(); } }
else { saveInfo = 'محفوظ على هذا الجهاز'; }
A.reseq(S);
if (S._migrated) { delete S._migrated; persist(); }
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then((v) => { persisted = v; }).catch(() => {}); } catch (e) {}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; if (view.name === 'settings') render(); });
function setNet() { document.body.classList.toggle('off', navigator.onLine === false); paintStatus(); }
setNet();
window.addEventListener('online', () => { setNet(); toast('عاد الاتصال بالإنترنت', false, 'info'); });
window.addEventListener('offline', () => { setNet(); toast('لا يوجد إنترنت. البرنامج يعمل وبياناتك محفوظة على جهازك', false, 'info'); });
const rdy = () => { try { window.__splashReady && window.__splashReady(); } catch (e) {} };
initCloud().then(rdy, rdy);
})();
</script>

<script>if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });</script>
